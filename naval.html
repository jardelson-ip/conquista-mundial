<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Batalha Naval</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe9ff;--panel:#ffffff;--panel2:#e6f3ff;--line:#a9d3f5;--txt:#16365c;--mut:#5a7ea3;--acc:#3a97e6;--accd:#1f6fb8;--ok:#22c55e;--sea:#4aa3e6;--sead:#3289cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;overflow:auto}
.logo{font-family:"Lilita One",system-ui,sans-serif;font-size:56px;text-align:center;line-height:.95;letter-spacing:2px;color:var(--accd);text-shadow:0 5px 0 rgba(22,54,92,.18)}
.logo small{display:block;font-size:34px;color:var(--acc)}
.sub{color:var(--mut);font-size:15px;text-align:center;max-width:320px;font-weight:600}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 rgba(58,151,230,.15);padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.inp{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:#f5faff;color:var(--txt);font-size:16px;font-weight:600;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--acc)}
.btn{padding:12px 16px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);font-weight:700;font-size:16px;color:var(--accd);box-shadow:0 4px 0 #a9d3f5;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--accd);box-shadow:0 4px 0 var(--accd)}
.btn.red{background:#ef5350;border-color:#c62828;color:#fff;box-shadow:0 4px 0 #c62828}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.lbl{font-size:14px;color:var(--mut);font-weight:600}
.code{font-family:"Lilita One",system-ui,sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel2);flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.on-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto}
.on-dot.off{background:#94a3b8}
.tbtn{padding:6px 11px;border-radius:999px;border:2px solid var(--line);font-size:13px;font-weight:700;background:#fff;color:var(--accd)}
.tbtn.sel{background:var(--acc);color:#fff;border-color:var(--accd)}
.opt{text-align:left;line-height:1.2}
.opt small{display:block;font-size:12px;font-weight:600;opacity:.85}
/* jogo */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:2px solid var(--line)}
.top .ttl{font-weight:800;font-size:15px;white-space:nowrap}
.top .ttl small{color:var(--mut);font-weight:600}
.timer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:999px;background:var(--panel2);font-size:15px}
.timer.low{background:#ef5350;color:#fff}
.ibtn{width:36px;height:36px;border-radius:12px;background:var(--panel2);color:var(--accd);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.chips{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--panel);border-bottom:2px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:700;border:2px solid transparent;white-space:nowrap}
.chip.cur{border-color:var(--acc)}
.chip.out{opacity:.5;text-decoration:line-through}
.chip .dot{width:11px;height:11px;border-width:1.5px}
#main{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;min-height:0;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--txt);display:flex;align-items:center;gap:6px}
.tab.sel{border-color:var(--accd);background:var(--acc);color:#fff}
.tab.done{opacity:.55}
.btitle{font:20px "Lilita One",system-ui,sans-serif;letter-spacing:.5px;color:var(--accd);text-align:center}
.grid{display:grid;gap:2px;width:min(94vw,calc(100dvh - 360px),520px);aspect-ratio:1;background:var(--panel);padding:6px;border-radius:16px;border:2px solid var(--line);box-shadow:0 6px 0 rgba(58,151,230,.15)}
.lb{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--mut)}
.cl{background:var(--sea);border-radius:5px;position:relative;display:flex;align-items:center;justify-content:center;font-size:min(4.2vw,22px);line-height:1;overflow:visible}
.cl.click{cursor:pointer}
.cl.click:hover{background:#6cb8ee}
.cl.ship{background:#64748b}
.cl.ship.selS{background:#f5b700}
.cl.sunk{background:#334155}
.cl.hit::after{content:"🔥"}
.cl.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:#fff;opacity:.85;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.cl.sunk.hit::after{content:"💥"}
.cl.aim{outline:3px solid #f5b700;outline-offset:-3px}
.r-h0{border-radius:10px 3px 3px 10px}.r-h1{border-radius:3px 10px 10px 3px}.r-v0{border-radius:10px 10px 3px 3px}.r-v1{border-radius:3px 3px 10px 10px}
.boom{position:absolute;inset:-60%;display:flex;align-items:center;justify-content:center;font-size:min(9vw,46px);pointer-events:none;z-index:5}
.bottom{background:var(--panel);border-top:2px solid var(--line);padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.banner{font-size:15px;line-height:1.35;min-height:20px;text-align:center;font-weight:600}
.banner b{color:var(--accd)}
.acts{display:flex;gap:6px}
.acts .btn{padding:10px 6px;font-size:14px;flex:1}
.bigbtn{font:24px "Lilita One",system-ui,sans-serif;letter-spacing:1px;padding:13px;border-radius:20px;background:var(--acc);color:#fff;width:100%;border:2px solid var(--accd);box-shadow:0 5px 0 var(--accd)}
.bigbtn:disabled{opacity:.4}
#shotBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:30;background:#16365c;color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:15px;display:none;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#shotBar.on{display:block;animation:pop .3s ease-out}
/* modal */
.back{position:fixed;inset:0;background:rgba(22,54,92,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.back.on{display:flex}
.sheet{background:var(--panel);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font:22px "Lilita One",system-ui,sans-serif;color:var(--accd)}
.list{display:flex;flex-direction:column;gap:6px;font-size:15px}
.list .it{padding:9px 11px;background:var(--panel2);border-radius:12px;display:flex;align-items:center;gap:8px}
.list .it .r{margin-left:auto;color:var(--mut);font-size:14px}
table.rk{width:100%;border-collapse:collapse;font-size:15px}
table.rk th{font-size:12px;color:var(--mut);font-weight:700;padding:6px 4px;text-align:center}
table.rk td{padding:9px 4px;text-align:center;border-top:2px solid var(--panel2)}
table.rk td:first-child,table.rk th:first-child{text-align:left}
table.rk tr.top1 td{background:#fff6cc}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:42vh;min-height:120px;overflow-y:auto;padding:4px 2px;-webkit-user-select:text;user-select:text}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;background:var(--panel2);font-size:15px;align-self:flex-start;line-height:1.3;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#d6ecff;border:2px solid var(--line)}
.msg small{display:block;color:var(--mut);font-size:11px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:6px 11px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:700;border:2px solid var(--line)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;padding:0 5px;border-radius:999px;background:#ef5350;color:#fff;font-size:11px;font-weight:800;line-height:18px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#16365c;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
/* dado 3D */
#diceLayer{position:fixed;inset:0;pointer-events:none;z-index:40;perspective:800px}
.dw{position:absolute;left:0;top:0;width:54px;height:54px;will-change:transform}
.dshadow{position:absolute;left:5px;top:50px;width:44px;height:11px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px)}
.cube{width:54px;height:54px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:11px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28),inset 0 -4px 0 rgba(0,0,0,.15);backface-visibility:hidden;background:#f8fafc}
.face i{width:9px;height:9px;border-radius:50%;place-self:center;visibility:hidden;background:#111}.face i.v{visibility:visible}
.f1{transform:translateZ(27px)}.f6{transform:rotateY(180deg) translateZ(27px)}.f3{transform:rotateY(90deg) translateZ(27px)}.f4{transform:rotateY(-90deg) translateZ(27px)}.f5{transform:rotateX(90deg) translateZ(27px)}.f2{transform:rotateX(-90deg) translateZ(27px)}
.dnum{position:absolute;left:50%;top:-38px;transform:translateX(-50%) scale(.4);font:32px "Lilita One",system-ui,sans-serif;color:#fff;text-shadow:0 3px 0 #000,0 0 8px rgba(0,0,0,.8);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.dnum.on{opacity:1;transform:translateX(-50%) scale(1)}
/* telas grandes */
#bigPop{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(22,54,92,.45);padding:18px}
#bigPop.on{display:flex}
.bp{width:min(420px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#ffffff,#e6f3ff);border:3px solid var(--acc);border-radius:24px;padding:20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .4s ease-out;display:flex;flex-direction:column;gap:12px}
.bp-title{font:46px/1 "Lilita One",system-ui,sans-serif;color:var(--acc);letter-spacing:2px;text-shadow:0 4px 0 var(--accd)}
.bp-sub{font-weight:700;font-size:19px}
.bp-small{font-size:14px;color:var(--mut);font-weight:600}
.bp .btn{font:20px "Lilita One",system-ui,sans-serif;letter-spacing:.5px;padding:12px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
#shotBar.on{animation:none}

/* ===== visual novo: mar, navios, barra de jogadores, faixa de ataque ===== */
.grid{position:relative;isolation:isolate;background:linear-gradient(180deg,#3d98dc,#2a78bd);border:4px solid var(--own,#a9d3f5);transition:border-color .3s}
.grid::before{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:0;opacity:.35;
  background:repeating-linear-gradient(170deg,transparent 0 14px,rgba(255,255,255,.35) 15px,transparent 17px 30px);background-size:200% 200%;animation:waves 9s linear infinite}
@keyframes waves{to{background-position:-160px 80px}}
.grid .lb{color:#e7f3ff;text-shadow:0 1px 1px rgba(0,0,0,.35);position:relative;z-index:1}
.cl{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);z-index:auto}
.cl.click:hover{background:rgba(255,255,255,.3)}
.cl.ship,.cl.sunk,.cl.ship.selS{background:rgba(255,255,255,.10)}
.cl.hit::after,.cl.miss::after{position:relative;z-index:3}
.cl.hit::after{content:"🔥";animation:fire .45s ease-in-out infinite alternate;display:block;filter:drop-shadow(0 0 4px #ff9800)}
@keyframes fire{to{transform:scale(1.18) translateY(-2px)}}
.cl.sunk.hit::after{content:"💥";animation:none}
.grid.under{--own:#ff3b30 !important;animation:underA .8s ease-in-out infinite}
@keyframes underA{50%{box-shadow:0 0 0 5px rgba(255,59,48,.35),0 0 26px rgba(255,59,48,.7)}}
.grid.drag{touch-action:none}
.ships{position:absolute;inset:0;pointer-events:none;z-index:1}
.shipv{position:absolute;padding:2px}
.shipv .sv{position:absolute;left:0;top:0}
.shipv .sv2{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--dl,0s);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6%) rotate(.8deg)}}
.shipv .wk{transform-box:fill-box;transform-origin:center;animation:wake 1.4s ease-out infinite}
.shipv .wk.w2{animation-delay:.7s}
@keyframes wake{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.4)}}
.shipv .smk{transform-box:fill-box;transform-origin:center;animation:smoke 2.2s ease-out infinite}
.shipv .smk.s2{animation-delay:1.1s}
@keyframes smoke{from{opacity:.85;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(-18px,-22px) scale(1.6)}}
.shipv.sel .sv2{filter:drop-shadow(0 0 3px #ffd54a) drop-shadow(0 0 7px #ffd54a)}
.shipv.sunk .sv2{animation:none;filter:grayscale(1) brightness(.5) drop-shadow(0 2px 2px rgba(0,0,0,.4));transform:rotate(-5deg) translateY(6%);opacity:.92}
.shipv.sunk .wk,.shipv.sunk .smk{display:none}
/* barra de jogadores (toque para ver o mar de cada um) */
.pbar{display:flex;gap:6px;padding:8px 8px 6px;overflow-x:auto;background:var(--panel);scrollbar-width:none;justify-content:center}
.pbar::-webkit-scrollbar{display:none}
.pcard{position:relative;flex:1 1 0;min-width:68px;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border-radius:14px;background:var(--panel2);border:3px solid transparent;color:var(--txt)}
.pcard.view{border-color:var(--accd);background:#fff;box-shadow:0 3px 0 var(--line)}
.pcard .pav{width:40px;height:40px;border-radius:11px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:22px/1 "Lilita One",system-ui,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3);border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pcard .pnm{font-size:12.5px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pst{font-size:11.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.pcard .bdg{position:absolute;top:-7px;right:-4px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px;color:#fff;white-space:nowrap}
.pcard.atk .pav{animation:atkG .9s ease-in-out infinite}
@keyframes atkG{50%{box-shadow:0 0 0 4px rgba(255,193,7,.6),0 0 16px rgba(255,193,7,.9)}}
.pcard.atk .bdg{background:#f59e0b}
.pcard.tgt .bdg{background:#ef4444;animation:pulseB .8s infinite}
@keyframes pulseB{50%{transform:scale(1.12)}}
.pcard.tgt .pav::after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;border:3px dashed #ef4444;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pcard.dead{opacity:.45;filter:grayscale(.8)}
.pcard .pav{position:relative}
/* faixa de quem ataca quem */
.turnbar{display:none;align-items:center;justify-content:center;gap:8px;padding:8px 10px;color:#fff;font-weight:800;font-size:15px;text-align:center;background:linear-gradient(90deg,var(--ca,#3a97e6),var(--cb,#1f6fb8));text-shadow:0 1px 2px rgba(0,0,0,.35);min-height:44px}
.turnbar.on{display:flex}
.turnbar .mini{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:16px/1 "Lilita One",system-ui,sans-serif;border:2px solid #fff;flex:none}
.turnbar .arr{font-size:20px;animation:arr 1s ease-in-out infinite}
@keyframes arr{50%{transform:translateX(4px)}}
.turnbar.alert{background:linear-gradient(90deg,#b91c1c,#ef4444);animation:alertB 1s ease-in-out infinite}
@keyframes alertB{50%{filter:brightness(1.18)}}
.turnbar.mine{background:linear-gradient(90deg,#f59e0b,#f97316)}
.btitle .own{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;background:var(--own);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
</style>
</head>
<body>

<!-- INÍCIO -->
<div class="screen on" id="home">
  <div class="center">
    <div class="logo">⚓ BATALHA<small>NAVAL</small></div>
    <div class="sub">De 2 a 4 jogadores, ou dupla contra dupla. Online e ao vivo.</div>
    <div class="card">
      <input class="inp" id="name" maxlength="14" placeholder="Seu nome">
      <button class="btn pri" id="bCreate">Criar sala</button>
    </div>
    <div class="card">
      <div class="lbl">Entrar numa sala</div>
      <div class="row"><input class="inp" id="codeIn" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="btn" id="bJoin" style="flex:.6">Entrar</button></div>
    </div>
    <button class="btn" id="bRank" style="width:100%;max-width:380px">🏆 Ranking da Batalha Naval</button>
    <a href="index.html" class="btn" style="width:100%;max-width:380px;text-align:center;text-decoration:none">⬅ Menu de jogos</a>
    <div class="sub" id="authMsg">Conectando…</div>
  </div>
</div>

<!-- SALA -->
<div class="screen" id="lobby">
  <div class="center">
    <div class="lbl">Código da sala</div>
    <div class="code" id="lCode">----</div>
    <button class="btn" id="bShare">Copiar convite</button>
    <div class="card">
      <div class="lbl">Tamanho da partida</div>
      <div class="row" id="lSize">
        <button class="btn opt" data-s="8">⚡ Partida rápida<small>mar 8x8 · 4 navios</small></button>
        <button class="btn opt" data-s="10">🐢 Partida mais longa<small>mar 10x10 · 5 navios</small></button>
      </div>
      <div class="lbl">Modo de jogo</div>
      <div class="row" id="lMode"><button class="btn" data-m="solo">Todos contra todos</button><button class="btn" data-m="duo">Dupla x Dupla</button></div>
      <div class="lbl">Jogadores (<span id="lCount">0</span>/4)</div>
      <div class="plist" id="lPlayers"></div>
      <button class="btn" id="bShuffle" style="display:none">🔀 Sortear duplas</button>
    </div>
    <button class="btn pri" id="bStart" style="width:100%;max-width:380px">Começar partida</button>
    <div class="sub" id="lWait"></div>
    <button class="btn" id="bLeaveLobby" style="width:100%;max-width:380px">Sair da sala</button>
  </div>
</div>

<!-- JOGO -->
<div class="screen" id="game">
  <div class="top">
    <div class="ttl" id="gTitle">Sala ----</div>
    <div class="timer" id="gTimer">1:00</div>
    <button class="ibtn" id="bChat" aria-label="Chat da dupla" style="display:none">💬<span id="nChat"></span></button>
    <button class="ibtn" id="bMenu" aria-label="Menu">☰</button>
  </div>
  <div class="pbar" id="pbar"></div>
  <div class="turnbar" id="turnbar"></div>
  <div id="main">
    <div class="btitle" id="bTitle"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom">
    <div class="banner" id="gBanner"></div>

const pickDie = fallback => (amAdm() && forcedDie) ? forcedDie : fallback();

// dado justo: cada número de 1 a 6 com exatamente a mesma chance (gerador criptográfico, sem viés)
function fairRoll() { const b = new Uint8Array(1); while (true) { crypto.getRandomValues(b); if (b[0] < 252) return (b[0] % 6) + 1; } }
function randInt(n) { const b = new Uint32Array(1); const lim = Math.floor(4294967296 / n) * n; while (true) { crypto.getRandomValues(b); if (b[0] < lim) return b[0] % n; } }
const cellName = (r, c) => LETTERS[c] + (r + 1);

/* ================= NOMES (easter eggs + ranking, iguais ao Ludo) ================= */
function canon(txt) {
  const map = {"1":"i","!":"i","|":"i","l":"i","y":"i","3":"e","€":"e","4":"a","@":"a","0":"o","5":"s","$":"s","z":"s","7":"t","+":"t","9":"g","6":"g","v":"u","w":"u"};
  let s = (txt || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  s = [...s].map(c => map[c] || c).join("").replace(/[^a-z]/g, "");
  s = s.replace(/(.)\1+/g, "$1").replace(/th/g, "t").replace(/gu/g, "g").replace(/h/g, "");
  return s;
}
const rev = t => [...(t || "")].reverse().join("");
const isMiguel = n => canon(n).includes("migei") || canon(rev(n)).includes("migei");
const isThomas = n => canon(n).includes("tomas") || canon(rev(n)).includes("tomas");
const funName = n => isMiguel(n) && !n.includes("🦆") ? n + " 🦆😭" : n;
const THOMAS_MSG = "🎖️ Esse nome já está reservado para um futuro general!";
function lev(a, b) {
  const m = a.length, n = b.length; const d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function rankName(typed) {
  const clean = (typed || "").replace(/🦆|😭/g, "").trim();
  const c = canon(clean); if (!c) return clean || "Sem nome";
  let best = null, bestScore = 9;
  FRIENDS.forEach(f => {
    const fc = canon(f); let score;
    if (c === fc || c.includes(fc) || (c.length >= 3 && fc.startsWith(c)) || (c.length >= 4 && fc.includes(c))) score = 0;
    else {
      const dFull = lev(c, fc), okFull = dFull <= Math.max(1, Math.floor(fc.length * .45));
      const dPre = c.length >= 5 ? lev(c, fc.slice(0, c.length)) : 99, okPre = dPre <= 1;
      score = okFull ? dFull / fc.length : (okPre ? dPre / c.length : 9);
    }
    if (score < bestScore) { bestScore = score; best = f; }
  });
  return best || (clean.charAt(0).toUpperCase() + clean.slice(1));
}
const rankKey = n => n.replace(/[.#$\[\]\/]/g, "_");

/* ================= FROTA ================= */
const shipCells = s => Array.from({length: s.len}, (_, k) => s.d === "h" ? [s.r, s.c + k] : [s.r + k, s.c]);
function fits(fleet, idx, s, N) {
  const cells = shipCells(s);
  if (cells.some(([r, c]) => r < 0 || c < 0 || r >= N || c >= N)) return false;
  const used = new Set(); fleet.forEach((o, k) => { if (k !== idx && o) shipCells(o).forEach(([r, c]) => used.add(r + "_" + c)); });
  return cells.every(([r, c]) => !used.has(r + "_" + c));
}
function randomFleet(N) {
  for (let tries = 0; tries < 50; tries++) {
    const fleet = []; let ok = true;
    for (const [len, name] of FLEETS[N]) {
      let placed = false;
      for (let t = 0; t < 400 && !placed; t++) {
        const s = {len, name, d: randInt(2) ? "h" : "v", r: randInt(N), c: randInt(N)};
        if (fits(fleet, -1, s, N)) { fleet.push(s); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return fleet;
  }
  return null;
}
function validFleet(fleet, N) {
  const def = FLEETS[N]; if (!Array.isArray(fleet) || fleet.length !== def.length) return false;
  return fleet.every((s, i) => s && s.len === def[i][0] && (s.d === "h" || s.d === "v") && fits(fleet, i, s, N));
}
const shipAt = (fleet, r, c) => fleet.findIndex(s => shipCells(s).some(([a, b]) => a === r && b === c));

/* ================= REGRAS ================= */
function norm(g) {
  g.order = arr(g.order); g.log = arr(g.log); g.out = arr(g.out); g.places = arr(g.places);
  g.team = g.team || {}; g.ready = g.ready || {}; g.rolls = g.rolls || {}; g.fleets = g.fleets || {};
  g.shots = g.shots || {}; g.shotTurn = g.shotTurn || {};
  Object.keys(g.fleets).forEach(u => g.fleets[u] = arr(g.fleets[u]));
  return g;
}
const cur = g => g.order[g.turn];
const nm = (g, u) => g.names[u];
const allies = (g, a, b) => a === b || (g.mode === "duo" && g.team[a] === g.team[b]);
const isOut = (g, u) => g.out.includes(u);
const opponents = (g, u) => g.order.filter(x => !allies(g, u, x) && !isOut(g, x));
const pending = (g, u) => opponents(g, u).filter(x => !g.shotTurn[x]);
const hitAt = (g, u, r, c) => (g.shots[u] || {})[r + "_" + c];
function sunkIdx(g, u) { const f = g.fleets[u] || []; return f.map((s, i) => shipCells(s).every(([r, c]) => hitAt(g, u, r, c) === "h") ? i : -1).filter(i => i >= 0); }
const shipsLeft = (g, u) => (g.fleets[u] || []).length - sunkIdx(g, u).length;
function logp(g, s) { g.log.push(s); if (g.log.length > 50) g.log = g.log.slice(-50); }
function nextTurn(g) {
  g.shotTurn = {}; g.aim = null;
  let i = g.turn, guard = 0;
  do { i = (i + 1) % g.order.length; guard++; } while (isOut(g, g.order[i]) && guard < 10);
  g.turn = i; g.turnNo = (g.turnNo || 0) + 1; g.deadline = now() + TURN_MS;
}
function checkEnd(g) {
  if (g.mode === "duo") {
    [0, 1].forEach(t => { if (!g.ended && g.order.filter(u => g.team[u] === t).every(u => isOut(g, u))) { g.ended = true; g.winTeam = 1 - t; } });
  } else {
    const alive = g.order.filter(u => !isOut(g, u));
    if (alive.length <= 1) { g.ended = true; g.places = [...alive, ...g.out.slice().reverse()]; }
  }
  if (g.ended) {
    g.phase = "end"; g.rankPending = true; g.endTs = now();
    logp(g, g.mode === "duo" ? `🏆 Dupla ${g.winTeam ? "B" : "A"} venceu!` : `🏆 ${nm(g, g.places[0])} venceu!`);
  }
}
function doShot(g, u, t, r, c) {
  g.shots[t] = g.shots[t] || {};
  const idx = shipAt(g.fleets[t], r, c); const res = idx >= 0 ? "h" : "m";
  g.shots[t][r + "_" + c] = res; g.shotTurn[t] = true;
  let sunk = null, elim = false;
  if (idx >= 0 && shipCells(g.fleets[t][idx]).every(([a, b]) => hitAt(g, t, a, b) === "h")) sunk = g.fleets[t][idx].name;
  if (sunk && shipsLeft(g, t) === 0) { elim = true; g.out.push(t); }
  g.lastShot = {by: u, to: t, r, c, res, sunk, elim, ts: now()};
  logp(g, `${res === "h" ? "🔥" : "💦"} ${nm(g, u)} atirou em ${nm(g, t)} (${cellName(r, c)}): ${res === "h" ? "acertou!" : "água"}${sunk ? ` · afundou o ${sunk}!` : ""}`);
  if (elim) logp(g, `☠️ ${nm(g, t)} perdeu toda a frota!`);
  checkEnd(g); if (g.ended) return;
  if (isOut(g, u)) { nextTurn(g); return; }
  if (!pending(g, u).length) nextTurn(g);
}
function randomFreeCell(g, t) {
  const N = g.size, free = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!hitAt(g, t, r, c)) free.push([r, c]);
  return free[randInt(free.length)];
}
function finalizeOrder(g) {
  const rk = (a, b) => (g.rolls[b].v - g.rolls[a].v) || (g.rolls[a].ts - g.rolls[b].ts);
  const sorted = g.order.slice().sort(rk);
  if (g.mode === "duo") { const A = sorted.filter(u => g.team[u] === g.team[sorted[0]]), B = sorted.filter(u => g.team[u] !== g.team[sorted[0]]); g.order = [A[0], B[0], A[1], B[1]]; }
  else g.order = sorted;
  g.turn = 0; g.turnNo = 1; g.shotTurn = {}; g.phase = "battle"; g.deadline = now() + TURN_MS;
  g.orderAnn = {list: g.order.map(u => [u, g.rolls[u].v]), ts: now()};
  logp(g, "🎲 Ordem pelo dado: " + g.order.map(u => `${nm(g, u)} (${g.rolls[u].v})`).join(" → "));
}

/* ================= AÇÕES ================= */
async function act(fn) {
  let err = null;
  try {
    await runTransaction(ref(db, `${ROOT}/rooms/${roomCode}/game`), g => {
      if (!g) return g;
      norm(g); err = null;
      const fail = m => { err = m; return false; };
      if (fn(g, fail) === false) return;
      return g;
    });
  } catch (e) { err = "Erro de conexão: " + e.message; }
  if (err) toast(err);
  return !err;
}
function aReadyFleet(fleet) {
  return act((g, fail) => {
    if (g.phase !== "setup") return false;
    if (!validFleet(fleet, g.size)) return fail("Frota inválida.");
    g.fleets[uid] = fleet; g.ready[uid] = true;
    if (g.order.every(u => g.ready[u])) { g.phase = "roll"; g.rollBy = now() + ROLL_MS; logp(g, "⚓ Todas as frotas posicionadas! Joguem o dado para definir a ordem."); }
  });
}
function aRoll() {
  return act((g, fail) => {
    if (g.phase !== "roll") return false;
    if (g.rolls[uid]) return fail("Você já jogou o dado.");
    g.rolls[uid] = {v: pickDie(fairRoll), ts: now()};
    if (g.order.every(u => g.rolls[u])) finalizeOrder(g);
  });
}
function aShoot(t, r, c) {
  return act((g, fail) => {
    if (g.ended || g.phase !== "battle") return fail("A batalha não está acontecendo.");
    if (cur(g) !== uid) return fail("Não é a sua vez.");
    if (!pending(g, uid).includes(t)) return fail("Você já atirou nesse jogador neste turno.");
    if (hitAt(g, t, r, c)) return fail("Você já atirou nessa casa.");
    doShot(g, uid, t, r, c);
  });
}
let lastTimeoutTry = 0;
function checkTimeout() {
  const g = R && R.game; if (!g || g.ended) return;
  const limit = g.phase === "setup" ? g.setupBy : g.phase === "roll" ? g.rollBy : g.deadline;
  if (!limit || now() < limit + 1500 || Date.now() - lastTimeoutTry < 3000) return;
  lastTimeoutTry = Date.now();
  const ph = g.phase, lim = limit;
  act(g2 => {
    if (g2.ended || g2.phase !== ph) return false;
    if (ph === "setup") {
      if (g2.setupBy !== lim || now() < g2.setupBy) return false;
      g2.order.forEach(u => { if (!g2.ready[u]) { g2.fleets[u] = randomFleet(g2.size); g2.ready[u] = true; } });
      logp(g2, "⏱ Tempo esgotado: frotas posicionadas automaticamente."); g2.phase = "roll"; g2.rollBy = now() + ROLL_MS;
    } else if (ph === "roll") {
      if (g2.rollBy !== lim || now() < g2.rollBy) return false;
      g2.order.forEach(u => { if (!g2.rolls[u]) g2.rolls[u] = {v: fairRoll(), ts: now() + 1}; });
      logp(g2, "⏱ Tempo esgotado: dado jogado automaticamente para quem faltou."); finalizeOrder(g2);
    } else {
      if (g2.deadline !== lim || now() < g2.deadline) return false;
      const u = cur(g2); logp(g2, `⏱ Tempo esgotado: tiros automáticos para ${nm(g2, u)}`);
      let guard = 0;
      while (!g2.ended && cur(g2) === u && pending(g2, u).length && guard++ < 6) { const t = pending(g2, u)[0]; const [r, c] = randomFreeCell(g2, t); doShot(g2, u, t, r, c); }
    }
  });
}

/* ================= RANKING (separado) ================= */
let rankClaimFor = null;
async function claimAndSaveRanking(g) {
  if (rankClaimFor === g.endTs) return; rankClaimFor = g.endTs;
  let res;
  try { res = await runTransaction(ref(db, `${ROOT}/rooms/${roomCode}/game/rankPending`), v => (v === true ? false : undefined)); }
  catch (e) { rankClaimFor = null; return; }
  if (!res || !res.committed) return;
  for (const u of g.order) {
    const rn = rankName(g.names[u]);
    if (!FRIENDS.includes(rn)) continue;   // só os 4 amigos entram no ranking
    await runTransaction(ref(db, `${ROOT}/ranking/${rankKey(rn)}`), e => {
      e = e || {n: rn, p1:0, p2:0, p3:0, p4:0, dw:0, dl:0, games:0};
      e.n = rn; e.games = (e.games || 0) + 1;
      if (g.mode === "duo") { if (g.team[u] === g.winTeam) e.dw = (e.dw || 0) + 1; else e.dl = (e.dl || 0) + 1; }
      else { const k = "p" + (g.places.indexOf(u) + 1); e[k] = (e[k] || 0) + 1; }
      return e;
    });
  }
}
async function openRanking() {
  let rows = [];
  try { const s = await get(ref(db, `${ROOT}/ranking`)); rows = Object.values(s.val() || {}).filter(r => FRIENDS.includes(r.n)); } catch (e) { return toast("Não foi possível abrir o ranking: confira as regras do Firebase."); }
  FRIENDS.forEach(f => { if (!rows.some(r => r.n === f)) rows.push({n: f, p1:0, p2:0, p3:0, p4:0, dw:0, dl:0, games:0}); });
  rows.sort((a, b) => (b.p1 - a.p1) || ((b.dw || 0) - (a.dw || 0)) || (b.p2 - a.p2) || (b.p3 - a.p3) || (a.n > b.n ? 1 : -1));
  openModal(`<h3>🏆 Ranking da Batalha Naval</h3>
    <div class="lbl">Nomes com erro de digitação ou parecidos contam para o amigo certo (ex.: "Lrissa" conta para Larissa).</div>
    <table class="rk"><tr><th>Nome</th><th>🥇</th><th>🥈</th><th>🥉</th><th>4º</th><th>Duplas<br>V / D</th><th>Jogos</th></tr>
    ${rows.map((r, i) => `<tr class="${i === 0 && (r.p1 || r.dw) ? "top1" : ""}"><td><b>${i + 1}.</b> ${esc(funName(r.n))}</td><td>${r.p1 || 0}</td><td>${r.p2 || 0}</td><td>${r.p3 || 0}</td><td>${r.p4 || 0}</td><td>${r.dw || 0} / ${r.dl || 0}</td><td>${r.games || 0}</td></tr>`).join("")}</table>
    <button class="btn" id="rkClose">Fechar</button>`, "rank");
  $("rkClose").onclick = closeModal;
}

/* ================= SALAS ================= */
const savedName = () => ($("name").value.trim() || localStorage.getItem("nv_name") || "").slice(0, 14);
function genCode() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({length: 4}, () => L[Math.floor(Math.random() * L.length)]).join(""); }
async function createRoom() {
  const raw = savedName(); if (!raw) return toast("Digite seu nome.");
  if (isThomas(raw)) return toast(THOMAS_MSG, 4000);
  if (isAdmName(raw) && !(await admAuth())) return;
  localStorage.setItem("nv_name", raw); const name = funName(raw);
  let code;
  for (let i = 0; i < 6; i++) { code = genCode(); const s = await get(ref(db, `${ROOT}/rooms/${code}/meta`)); if (!s.exists()) break; }
  await set(ref(db, `${ROOT}/rooms/${code}`), {meta: {host: uid, status: "lobby", mode: "solo", size: 8, created: now()}, players: {[uid]: {name, joined: now(), online: true, team: 0}}});
  enterRoom(code);
}
async function joinRoom(code) {
  code = (code || "").trim().toUpperCase();
  if (code.length !== 4) return toast("O código tem 4 letras.");
  const raw = savedName(); if (!raw) return toast("Digite seu nome.");
  if (isThomas(raw)) return toast(THOMAS_MSG, 4000);
  if (isAdmName(raw) && !(await admAuth())) return;
  localStorage.setItem("nv_name", raw); const name = funName(raw);
  const [ms, pss] = await Promise.all([get(ref(db, `${ROOT}/rooms/${code}/meta`)), get(ref(db, `${ROOT}/rooms/${code}/players`))]);
  if (!ms.exists()) return toast("Sala não encontrada.");
  const meta = ms.val(), players = pss.val() || {};
  if (players[uid]) return enterRoom(code);
  if (meta.status !== "lobby") return toast("Essa partida já começou.");
  let ok = false, why = "";
  await runTransaction(ref(db, `${ROOT}/rooms/${code}/players`), ps => {
    ps = ps || {};
    if (ps[uid]) { ok = true; return ps; }
    const list = Object.values(ps);
    if (list.length >= 4) { why = "Sala cheia (máximo 4)."; return; }
    const cA = list.filter(p => p.team === 0).length, cB = list.length - cA;
    ps[uid] = {name, joined: now(), online: true, team: cA <= cB ? 0 : 1}; ok = true; return ps;
  });
  if (!ok) return toast(why || "Não foi possível entrar.");
  enterRoom(code);
}
function enterRoom(code) {
  leaveListeners();
  roomCode = code; localStorage.setItem("nv_room", code);
  history.replaceState(null, "", location.pathname + "?sala=" + code);
  const onRef = ref(db, `${ROOT}/rooms/${code}/players/${uid}/online`);
  unsubConn = onValue(ref(db, ".info/connected"), s => { if (s.val() === true) onDisconnect(onRef).set(false).then(() => set(onRef, true)); });
  firstSnap = true; R = {}; const got = {};
  // a sala é lida em partes (meta, jogadores, jogo) para o chat de cada dupla poder ser privado
  unsubRoom = ["meta", "players", "game"].map(k => onValue(ref(db, `${ROOT}/rooms/${code}/${k}`), s => {
    if (!R) return;
    R[k] = s.val(); got[k] = true;
    if (k === "game" && R.game) norm(R.game);
    if (!got.meta || !got.players || !got.game) return;
    if (!R.meta || !R.players || !R.players[uid]) { toast("Você não está nesta sala."); leaveRoom(); return; }
    syncChat(); render();
  }));
}
function leaveListeners() { if (unsubRoom) unsubRoom.forEach(f => f()); if (unsubConn) unsubConn(); unsubRoom = unsubConn = null; stopChat(); }
async function leaveRoom() {
  const code = roomCode;
  if (code && R && R.meta && R.meta.status === "lobby" && R.players && R.players[uid]) {
    const others = Object.keys(R.players).filter(u => u !== uid);
    if (!others.length) await set(ref(db, `${ROOT}/rooms/${code}`), null);
    else { const upd = {[`players/${uid}`]: null}; if (R.meta.host === uid) upd["meta/host"] = others[0]; await update(ref(db, `${ROOT}/rooms/${code}`), upd); }
  } else if (code) set(ref(db, `${ROOT}/rooms/${code}/players/${uid}/online`), false);
  leaveListeners(); roomCode = null; R = null; localStorage.removeItem("nv_room");
  history.replaceState(null, "", location.pathname);
  closeModal(); show("home");
}
function buildGame(ps, mode, size) {
  const uids = Object.keys(ps).sort((a, b) => ps[a].joined - ps[b].joined);
  const g = {mode, size, order: uids.slice(), names: {}, col: {}, team: {}, ready: {}, rolls: {}, fleets: {}, shots: {}, shotTurn: {}, out: [], places: [], log: [], phase: "setup", turn: 0, turnNo: 0, ended: false};
  if (mode === "duo") {
    const A = uids.filter(u => ps[u].team === 0), B = uids.filter(u => ps[u].team === 1);
    A.forEach((u, i) => { g.team[u] = 0; g.col[u] = i ? 4 : 0; }); B.forEach((u, i) => { g.team[u] = 1; g.col[u] = i ? 3 : 1; });
  } else uids.forEach((u, i) => g.col[u] = [0, 1, 2, 3][i]);
  uids.forEach(u => g.names[u] = ps[u].name);
  g.setupBy = now() + SETUP_MS;
  logp(g, `⚓ Partida ${size === 8 ? "rápida (8x8)" : "mais longa (10x10)"} começou! Posicionem a frota.`);
  if (mode === "duo") logp(g, `👥 Dupla A: ${uids.filter(u => g.team[u] === 0).map(u => g.names[u]).join(" e ")} · Dupla B: ${uids.filter(u => g.team[u] === 1).map(u => g.names[u]).join(" e ")}`);
  return g;
}
let starting = false;
async function startGame() {
  const ps = R.players; const uids = Object.keys(ps); const duo = R.meta.mode === "duo";
  if (uids.length < 2) return toast("Precisa de pelo menos 2 jogadores.");
  if (duo && (uids.length !== 4 || uids.filter(u => ps[u].team === 0).length !== 2)) return toast("No modo dupla precisa de 4 jogadores, 2 em cada dupla.");
  if (R.game || starting) return; starting = true; setTimeout(() => starting = false, 4000);
  await update(ref(db, `${ROOT}/rooms/${roomCode}`), {"meta/status": "playing", game: buildGame(ps, duo ? "duo" : "solo", R.meta.size === 10 ? 10 : 8), chat: null});
}

/* ================= CHAT DA DUPLA ================= */
let chatKey = null, chatUnsub = null, chatMsgs = [], chatSeen = 0, chatUnread = 0, chatFirst = true;
const QUICK = ["Ataca o barco dele em…", "Acertei ele! 🔥", "Ele ainda tem navio grande", "Cuidado! ⚠️", "Boa, parceiro! 👏"];
function stopChat() { if (chatUnsub) chatUnsub(); chatUnsub = null; chatKey = null; chatMsgs = []; chatUnread = 0; chatFirst = true; updChatBadge(); }
function syncChat() {
  const g = R && R.game;
  const key = g && g.mode === "duo" && g.team[uid] !== undefined ? "t" + g.team[uid] : null;
  if (key === chatKey) return;
  stopChat(); if (!key) return;
  chatKey = key;
  chatUnsub = onValue(query(ref(db, `${ROOT}/rooms/${roomCode}/chat/${key}`), limitToLast(60)), s => {
    const list = []; s.forEach(c => { list.push(c.val()); });
    chatMsgs = list;
    const fresh = list.filter(m => m.ts > chatSeen && m.u !== uid);
    if (chatFirst) { chatFirst = false; chatSeen = Math.max(chatSeen, ...list.map(m => m.ts), 0); }
    else if (fresh.length) {
      chatSeen = Math.max(...list.map(m => m.ts));
      if (modalKind !== "chat") { chatUnread += fresh.length; const m = fresh[fresh.length - 1]; toast(`💬 ${m.n}: ${m.m}`, 3500); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }
    }
    updChatBadge(); if (modalKind === "chat") drawChat();
  }, () => { if (chatUnsub) chatUnsub(); chatUnsub = null; });
}
function updChatBadge() { const n = $("nChat"); if (n) n.innerHTML = chatUnread ? `<span class="badge">${chatUnread > 9 ? "9+" : chatUnread}</span>` : ""; }
function drawChat() {
  const box = $("chatList"); if (!box) return;
  box.innerHTML = chatMsgs.length ? chatMsgs.map(m => `<div class="msg ${m.u === uid ? "me" : ""}"><small>${esc(m.n)}</small>${esc(m.m)}</div>`).join("") : '<div class="lbl" style="text-align:center;margin:auto">Só você e seu parceiro veem este chat.</div>';
  box.scrollTop = box.scrollHeight;
}
async function sendChat(text) {
  text = (text || "").trim().slice(0, 200); if (!text || !chatKey) return;
  if (isThomas(text)) return toast("🎖️ A palavra Thomas está reservada para um futuro general!", 3500);
  try { await push(ref(db, `${ROOT}/rooms/${roomCode}/chat/${chatKey}`), {u: uid, n: R.game.names[uid], m: text, ts: now()}); }
  catch (e) { toast("Não foi possível enviar: confira as regras do Firebase."); }
}
function openChat() {
  const g = R.game; const partner = g.order.find(x => x !== uid && g.team[x] === g.team[uid]);
  chatUnread = 0; updChatBadge();
  openModal(`<h3>💬 Chat da Dupla ${g.team[uid] ? "B" : "A"}</h3>
    <div class="lbl">Só você e <b style="color:${PCOL[g.col[partner]].f}">${esc(nm(g, partner))}</b> veem estas mensagens.</div>
    <div class="msgs" id="chatList"></div>
    <div class="quick">${QUICK.map((q, i) => `<button data-q="${i}">${q}</button>`).join("")}</div>
    <div class="row"><input class="inp" id="chatIn" maxlength="200" placeholder="Mensagem para o parceiro…" style="flex:1"><button class="btn pri" id="chatSend" style="flex:none;width:84px">Enviar</button></div>
    <button class="btn" id="chatClose">Fechar</button>`, "chat");
  drawChat();
  const send = () => { const i = $("chatIn"); sendChat(i.value); i.value = ""; i.focus(); };
  $("chatSend").onclick = send;
  $("chatIn").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  document.querySelectorAll(".quick button").forEach(b => b.onclick = () => { const q = QUICK[+b.dataset.q]; if (q.endsWith("…")) { $("chatIn").value = q.replace("…", " "); $("chatIn").focus(); } else sendChat(q); });
  $("chatClose").onclick = closeModal;
}

/* ================= DADO 3D (igual ao do War e do Ludo) ================= */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE_ROT = {1:[0,0], 6:[0,180], 3:[0,-90], 4:[0,90], 5:[-90,0], 2:[90,0]};
const faceHTML = n => `<div class="face f${n}">${Array.from({length: 9}, (_, i) => `<i class="${PIPS[n].includes(i) ? "v" : ""}"></i>`).join("")}</div>`;
function throwDie(v) {
  const L = $("diceLayer"); L.innerHTML = "";
  const w = document.createElement("div"); w.className = "dw";
  w.innerHTML = `<div class="dshadow"></div><div class="cube">${[1,2,3,4,5,6].map(faceHTML).join("")}</div><div class="dnum">${v}</div>`;
  L.appendChild(w);
  const cube = w.querySelector(".cube");
  const x = innerWidth / 2 - 27, y = innerHeight * .32;
  const x0 = -70, y0 = innerHeight * .8, mx = (x0 + x) / 2, my = y - 150;
  const [rx, ry] = FACE_ROT[v];
  const sx = rx + 360 * (2 + Math.floor(Math.random() * 2)), sy = ry + 360 * (2 + Math.floor(Math.random() * 2)), rz0 = Math.random() * 300 + 200;
  const T = 1150;
  const path = w.animate([
    {transform: `translate(${x0}px,${y0}px) scale(.7)`}, {transform: `translate(${mx}px,${my}px) scale(1.3)`, offset: .42},
    {transform: `translate(${x}px,${y}px) scale(1)`, offset: .7}, {transform: `translate(${x + 8}px,${y - 22}px) scale(1.06)`, offset: .83},
    {transform: `translate(${x}px,${y}px) scale(1)`}
  ], {duration: T, easing: "cubic-bezier(.25,.6,.35,1)", fill: "forwards"});
  cube.animate([{transform: `rotateX(${sx}deg) rotateY(${sy}deg) rotateZ(${rz0}deg)`}, {transform: `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(0deg)`}], {duration: T, easing: "cubic-bezier(.15,.6,.25,1)", fill: "forwards"});
  return path.finished.then(() => {
    const z = w.animate([{transform: `translate(${x}px,${y}px) scale(1)`}, {transform: `translate(${x}px,${y}px) scale(1.9)`, offset: .35}, {transform: `translate(${x}px,${y}px) scale(1.5)`}], {duration: 650, easing: "ease-out", fill: "forwards"});
    w.querySelector(".dnum").classList.add("on");
    try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
    return z.finished.then(() => setTimeout(() => w.remove(), 1600));
  });
}

function shipSVG(s, colIdx) {
  const L = s.len * 100, c = PCOL[colIdx] ? PCOL[colIdx].f : "#94a3b8", n = s.name;
  const hullG = `<linearGradient id="hg${s.len}${colIdx}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa8b8"/><stop offset=".55" stop-color="#6b7a8d"/><stop offset="1" stop-color="#465466"/></linearGradient>`;
  const hull = (top, bot) => `M10,${(top + bot) / 2} Q12,${top} 34,${top} L${L - 52},${top} Q${L - 14},${top + 2} ${L - 4},${(top + bot) / 2} Q${L - 14},${bot - 2} ${L - 52},${bot} L34,${bot} Q12,${bot} 10,${(top + bot) / 2} Z`;
  let body = "";
  if (n === "Submarino") {
    body = `<ellipse cx="${L / 2}" cy="56" rx="${L / 2 - 8}" ry="24" fill="#3f4b5c" stroke="#263140" stroke-width="3"/>
      <ellipse cx="${L / 2 - 10}" cy="47" rx="${L / 2 - 40}" ry="7" fill="#5b6a7e"/>
      <rect x="${L / 2 - 26}" y="22" width="44" height="26" rx="8" fill="#4b5869" stroke="#263140" stroke-width="3"/>
      <line x1="${L / 2 + 6}" y1="22" x2="${L / 2 + 6}" y2="6" stroke="#263140" stroke-width="4"/><line x1="${L / 2 + 6}" y1="7" x2="${L / 2 + 16}" y2="7" stroke="#263140" stroke-width="4"/>
      <rect x="40" y="62" width="${L - 80}" height="5" rx="2.5" fill="${c}"/>
      <circle cx="${L / 2 - 4}" cy="35" r="4" fill="#cfe8ff"/>`;
  } else {
    const wide = n === "Porta-aviões", top = wide ? 16 : 26, bot = wide ? 86 : 80;
    body = `<path d="${hull(top, bot)}" fill="url(#hg${s.len}${colIdx})" stroke="#2f3b4b" stroke-width="3"/>
      <path d="${hull(top + 7, bot - 9)}" fill="#a7b4c3" opacity=".55"/>
      <rect x="30" y="${bot - 12}" width="${L - 90}" height="5" rx="2.5" fill="${c}"/>`;
    if (wide) {
      body += `<line x1="40" y1="51" x2="${L - 80}" y2="51" stroke="#fff" stroke-width="3" stroke-dasharray="14 10" opacity=".85"/>
        <rect x="${L - 150}" y="18" width="46" height="22" rx="4" fill="#4b5869" stroke="#2f3b4b" stroke-width="3"/>
        <rect x="${L - 138}" y="8" width="14" height="12" fill="#2f3b4b"/>
        <text x="90" y="44" font-size="30" transform="rotate(90 90 34)" fill="#2f3b4b">✈</text>
        <text x="190" y="44" font-size="30" transform="rotate(90 190 34)" fill="#2f3b4b">✈</text>`;
    } else {
      const tur = x => `<circle cx="${x}" cy="53" r="13" fill="#56657a" stroke="#2f3b4b" stroke-width="3"/><rect x="${x + 6}" y="49" width="30" height="7" rx="3" fill="#2f3b4b"/>`;
      const turB = x => `<circle cx="${x}" cy="53" r="13" fill="#56657a" stroke="#2f3b4b" stroke-width="3"/><rect x="${x - 36}" y="49" width="30" height="7" rx="3" fill="#2f3b4b"/>`;
      const bridge = (x, w) => `<rect x="${x}" y="36" width="${w}" height="34" rx="6" fill="#d7dee7" stroke="#2f3b4b" stroke-width="3"/><rect x="${x + 6}" y="42" width="${w - 12}" height="7" rx="2" fill="#5b8dbf"/>`;
      const funnel = x => `<rect x="${x}" y="30" width="20" height="30" rx="5" fill="#3d4a5b" stroke="#2f3b4b" stroke-width="2"/><rect x="${x}" y="30" width="20" height="7" fill="${c}"/>
        <circle class="smk" cx="${x + 10}" cy="22" r="7" fill="#cbd5e1"/><circle class="smk s2" cx="${x + 10}" cy="22" r="6" fill="#e2e8f0"/>`;
      if (n === "Encouraçado") body += turB(70) + tur(L - 120) + bridge(L / 2 - 50, 64) + funnel(L / 2 + 22) + `<circle cx="${L - 70}" cy="53" r="8" fill="#56657a" stroke="#2f3b4b" stroke-width="2"/>`;
      else if (n === "Cruzador") body += turB(64) + bridge(L / 2 - 30, 56) + funnel(L / 2 + 34) + tur(L - 90);
      else body += bridge(50, 52) + funnel(112) + tur(L - 66);   // Destroier
    }
  }
  const wake = `<ellipse class="wk" cx="6" cy="54" rx="10" ry="18" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><ellipse class="wk w2" cx="-4" cy="54" rx="10" ry="24" fill="none" stroke="#fff" stroke-width="2.5" opacity=".5"/>`;
  return `<svg viewBox="-20 ${n === "Porta-aviões" ? 10 : 16} ${L + 30} ${n === "Porta-aviões" ? 82 : 72}" preserveAspectRatio="none" width="100%" height="100%"><defs>${hullG}</defs>${wake}${body}</svg>`;
}
// desenha os navios por cima da grade, ocupando as casas certas
function drawShips(fleet, colIdx, opt = {}) {
  const grid = $("grid"); let lay = grid.querySelector(".ships"); if (lay) lay.remove();
  lay = document.createElement("div"); lay.className = "ships"; grid.appendChild(lay);
  const cellEl = (r, c) => grid.querySelector(`.cl[data-r="${r}"][data-c="${c}"]`);
  fleet.forEach((s, i) => {
    if (!s || (opt.only && !opt.only.has(i))) return;
    const [r1, c1] = shipCells(s)[s.len - 1], a = cellEl(s.r, s.c), b = cellEl(r1, c1); if (!a || !b) return;
    const x = a.offsetLeft, y = a.offsetTop, w = b.offsetLeft + b.offsetWidth - x, h = b.offsetTop + b.offsetHeight - y;
    const box = document.createElement("div");
    box.className = "shipv" + (opt.sunk && opt.sunk.has(i) ? " sunk" : "") + (opt.sel === i ? " sel" : "");

    endShown = g.endTs;
    const body = g.mode === "duo"
      ? `<div class="bp-sub">Dupla ${g.winTeam ? "B" : "A"} venceu!</div><div class="list" style="text-align:left">${g.order.filter(u => g.team[u] === g.winTeam).map(u => `<div class="it">🥇 ${esc(nm(g, u))}</div>`).join("")}${g.order.filter(u => g.team[u] !== g.winTeam).map(u => `<div class="it">🥈 ${esc(nm(g, u))}</div>`).join("")}</div>`
      : `<div class="list" style="text-align:left">${g.places.map((u, i) => `<div class="it"><b style="width:28px">${med[i]}</b><i class="dot" style="background:${PCOL[g.col[u]].f}"></i>${esc(nm(g, u))}${u === uid ? " (você)" : ""}</div>`).join("")}</div>`;
    setTimeout(() => showBig(`<div style="font-size:54px">🏆</div><div class="bp-title" style="font-size:38px">FIM DE JOGO</div>${body}
      <div class="bp-small">O resultado já foi somado no ranking da Batalha Naval.</div>
      <button class="btn" id="bigRank">🏆 Ver ranking</button>
      ${R.meta.host === uid ? `<button class="btn pri" id="bigNew">Nova partida</button>` : `<div class="bp-small">O criador da sala pode começar uma nova partida.</div>`}
      <button class="btn" id="bigOk">Fechar</button>`), firstSnap ? 0 : 3500);
  }
  if (g.ended && g.rankPending) claimAndSaveRanking(g);
  firstSnap = false;
}
setInterval(() => {
  const g = R && R.game; if (!g || !R.meta || R.meta.status !== "playing") return;
  if (g.ended) { $("gTimer").textContent = "fim"; $("gTimer").classList.remove("low"); return; }
  const lim = g.phase === "setup" ? g.setupBy : g.phase === "roll" ? g.rollBy : g.deadline;
  const s = Math.max(0, Math.ceil((lim - now()) / 1000));
  $("gTimer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("gTimer").classList.toggle("low", s <= 10);
  checkTimeout();
}, 250);

/* ================= BOTÕES ================= */
const safeRun = fn => fn().catch(e => { console.error(e); toast(String(e && (e.code || e.message) || "").includes("PERMISSION") || String(e).toLowerCase().includes("permission") ? "O Firebase bloqueou o acesso: publique as regras novas (Realtime Database → Regras)." : "Erro: " + (e.message || e), 5000); });
$("bCreate").onclick = () => uid ? safeRun(createRoom) : toast("Ainda conectando…");
$("bJoin").onclick = () => uid ? safeRun(() => joinRoom($("codeIn").value)) : toast("Ainda conectando…");
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") $("bJoin").click(); });
$("bRank").onclick = () => uid ? openRanking() : toast("Ainda conectando…");
$("bShare").onclick = share;
$("bStart").onclick = startGame;
$("bLeaveLobby").onclick = leaveRoom;
$("bMenu").onclick = openMenu;
$("bChat").onclick = () => R && R.game && R.game.mode === "duo" && openChat();
$("bShuffle").onclick = async () => {
  const us = shuffle(Object.keys(R.players)); const upd = {};
  us.forEach((u, i) => upd[`players/${u}/team`] = i < 2 ? 0 : 1);
  await update(ref(db, `${ROOT}/rooms/${roomCode}`), upd); toast("Duplas sorteadas!");
};

/* ================= INÍCIO ================= */
$("name").value = localStorage.getItem("nv_name") || "";
const urlCode = new URLSearchParams(location.search).get("sala");
if (urlCode) $("codeIn").value = urlCode.toUpperCase();
onAuthStateChanged(auth, async user => {
  if (!user) { signInAnonymously(auth).catch(e => $("authMsg").textContent = "Erro ao conectar: " + e.message); return; }
  uid = user.uid; $("authMsg").textContent = "Conectado ✔";
  const saved = localStorage.getItem("nv_room");
  const target = (urlCode || saved || "").toUpperCase();
  if (target) {
    try {
      const s = await get(ref(db, `${ROOT}/rooms/${target}/players/${uid}`));
      if (s.exists()) { enterRoom(target); return; }
      if (saved === target) localStorage.removeItem("nv_room");
    } catch (e) { $("authMsg").textContent = "Erro ao acessar o banco: " + e.message + " (confira as regras do Firebase)"; }
  }
});
</script>
</body>
</html>
