<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Conquista Mundial</title>
<style>
:root{--bg:#0f172a;--panel:#111a2e;--panel2:#1a2540;--line:#2a3654;--txt:#e5e7eb;--mut:#94a3b8;--acc:#f5b700;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;overflow:auto}
.logo{font-size:34px;font-weight:800;letter-spacing:.5px;text-align:center;line-height:1.1}
.logo span{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;text-align:center;max-width:320px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--acc)}
.btn{padding:13px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);color:#2a1d00;border-color:var(--acc)}
.btn.red{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.lbl{font-size:13px;color:var(--mut)}
.code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff}
.on-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto}
.on-dot.off{background:#64748b}
/* game */
#game{background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:14px;white-space:nowrap}
.top .ttl small{color:var(--mut);font-weight:500}
.timer{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--panel2);font-size:14px}
.timer.low{background:#7f1d1d;color:#fff}
.ibtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16px}
.chips{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--panel2);font-size:12px;border:2px solid transparent;white-space:nowrap}
.chip.cur{border-color:var(--acc)}
.chip.dead{opacity:.4;text-decoration:line-through}
.chip .dot{width:11px;height:11px;border-width:1.5px}
#mapbox{flex:1;position:relative;overflow:hidden;min-height:0;background:#9cc9e8}
#map{width:100%;height:100%;display:block;touch-action:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.92);color:#0f172a;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0f172a;font-weight:600}
.bottom{background:var(--panel);border-top:1px solid var(--line);padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.banner{font-size:14px;line-height:1.35;min-height:20px}
.banner b{color:var(--acc)}
.warn{font-size:12px;color:#fca5a5}
.acts{display:flex;gap:6px}
.acts .btn{padding:10px 6px;font-size:13px;flex:1}
.acts .btn.pri{flex:1.6}
/* modal */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.back.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:80vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.step{display:flex;align-items:center;justify-content:center;gap:14px}
.step button{width:52px;height:52px;border-radius:14px;background:var(--panel2);font-size:26px;font-weight:700}
.step .val{font-size:36px;font-weight:800;min-width:70px;text-align:center}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.vs .side{flex:1;padding:10px;border-radius:12px;background:var(--panel2);text-align:center}
.vs .side b{display:block;font-size:24px}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2);font-size:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tcard .sym{font-size:26px;line-height:1}
.tcard.sel{border-color:var(--acc);background:#2b2410}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px}
.list .it{padding:9px 11px;background:var(--panel2);border-radius:10px;display:flex;align-items:center;gap:8px}
.list .it .r{margin-left:auto;color:var(--mut);font-size:13px}
/* battle overlay */
#battle{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:none;flex-direction:column;gap:6px;align-items:center;z-index:5;min-width:250px;pointer-events:none}
#battle.on{display:flex}
#battle .bt{font-size:12px;color:var(--mut);text-align:center}
.drow{display:flex;gap:6px;align-items:center}
.die{width:34px;height:34px;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.die i{width:6px;height:6px;border-radius:50%;background:#fff;place-self:center;visibility:hidden}
.die i.v{visibility:visible}
.die.a{background:#dc2626}
.die.d{background:#e5e7eb}
.die.d i{background:#111827}
.die.lose{opacity:.35}
.die.rolling{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.res{font-size:14px;font-weight:700}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#020617;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90vw;text-align:center;border:1px solid var(--line)}
#toast.on{display:block}
.obj{font-size:16px;line-height:1.45;padding:14px;border-radius:12px;background:#2b2410;border:1px solid #5c4708}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen on" id="home">
  <div class="center">
    <div class="logo">CONQUISTA<br><span>MUNDIAL</span></div>
    <div class="sub">Domine o mundo com seus amigos. De 2 a 4 jogadores, online e ao vivo.</div>
    <div class="card">
      <div class="lbl">Seu apelido</div>
      <input class="inp" id="name" maxlength="14" placeholder="Ex.: General Zé">
      <button class="btn pri" id="bCreate">Criar sala</button>
    </div>
    <div class="card">
      <div class="lbl">Entrar numa sala</div>
      <div class="row"><input class="inp" id="codeIn" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="btn" id="bJoin" style="flex:.6">Entrar</button></div>
    </div>
    <div class="sub" id="authMsg">Conectando…</div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="lobby">
  <div class="center">
    <div class="lbl">Código da sala</div>
    <div class="code" id="lCode">----</div>
    <button class="btn" id="bShare">Copiar convite</button>
    <div class="card">
      <div class="lbl">Jogadores (<span id="lCount">0</span>/4)</div>
      <div class="plist" id="lPlayers"></div>
    </div>
    <button class="btn pri" id="bStart" style="width:100%;max-width:360px">Começar partida</button>
    <div class="sub" id="lWait"></div>
    <button class="btn" id="bLeaveLobby" style="width:100%;max-width:360px">Sair da sala</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="top">
    <div class="ttl" id="gTitle">Sala ---- <small></small></div>
    <div class="timer" id="gTimer">2:00</div>
    <button class="ibtn" id="bMenu" aria-label="Menu">☰</button>
  </div>
  <div class="chips" id="gChips"></div>
  <div id="mapbox">
    <svg id="map" viewBox="0 0 680 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="loading" id="mapLoading">Carregando mapa…</div>
    <div class="zoom">
      <button id="zIn" aria-label="Aproximar">+</button>
      <button id="zOut" aria-label="Afastar">−</button>
      <button id="zReset" aria-label="Centralizar" style="font-size:15px">⤢</button>
    </div>
    <div id="battle"></div>
  </div>
  <div class="bottom">
    <div class="banner" id="gBanner"></div>
    <div class="warn" id="gWarn"></div>
    <div class="acts">
      <button class="btn" id="bCards">🃏 <span id="nCards">0</span></button>
      <button class="btn" id="bObj">🎯</button>
      <button class="btn" id="bConts">🌍</button>
      <button class="btn" id="bLog">📜</button>
      <button class="btn pri" id="bNext">Próxima fase</button>
    </div>
  </div>
</div>

<div class="back" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, update, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDuYXPb-vzdvZLnHeX1-E2ex7SiBTWYprE",
  authDomain: "battle-world-ce05d.firebaseapp.com",
  databaseURL: "https://battle-world-ce05d-default-rtdb.firebaseio.com",
  projectId: "battle-world-ce05d",
  storageBucket: "battle-world-ce05d.firebasestorage.app",
  messagingSenderId: "665723143522",
  appId: "1:665723143522:web:4f38528322851e9889d83b"
};
const TURN_MS = 120000;          // 2 minutos por turno
const PASSIVE_LIMIT = 7;         // rodadas sem atacar até a punição
const GOLD_AT = 10;              // bolinha dourada a partir de 10 soldados

/* ================= DADOS DO MUNDO ================= */
const CONT = {
  an:{n:"América do Norte",b:5}, as:{n:"América do Sul",b:3}, eu:{n:"Europa",b:5},
  af:{n:"África",b:3}, asi:{n:"Ásia",b:7}, oc:{n:"Oceania",b:2}
};
// id, nome, continente, longitude, latitude (posição da bolinha)
const T = [
 ["alasca","Alasca","an",-152,64],["canw","Canadá Oeste","an",-115,58],["cane","Canadá Leste","an",-78,54],["groen","Groenlândia","an",-41,72],["euaw","EUA Oeste","an",-114,40],["euae","EUA Leste","an",-86,37],["mex","México","an",-102,24],["amc","América Central","an",-87,14.5],["carib","Caribe","an",-74,20],
 ["col","Colômbia","as",-74,3],["ven","Venezuela","as",-64,6],["peru","Peru","as",-75,-11],["bra","Brasil","as",-50,-10],["arg","Argentina","as",-62,-35],["chi","Chile","as",-70.5,-26],
 ["uk","Reino Unido","eu",-3,54],["esc","Escandinávia","eu",17,64],["ibe","Península Ibérica","eu",-4,40],["fra","França","eu",2,46.5],["euc","Europa Central","eu",22,51],["ita","Itália/Bálcãs","eu",19,42.5],["rus","Rússia","eu",43,57],
 ["naf","Norte da África","af",3,28],["egi","Egito","af",29,22],["afo","África Ocidental","af",-4,12],["chif","Chifre da África","af",39,5],["congo","Congo","af",20,-4],["afs","África do Sul","af",26,-24],
 ["tur","Turquia","asi",36,39],["om","Oriente Médio","asi",45,26],["ira","Irã","asi",60,31],["caz","Cazaquistão","asi",67,47],["sibw","Sibéria Ocidental","asi",80,63],["sibe","Sibéria Oriental","asi",128,64],["mon","Mongólia","asi",103,46.5],["chn","China","asi",104,32],["cor","Coreia","asi",127.5,37.5],["jap","Japão","asi",139,36.5],["ind","Índia","asi",79,21],["sea","Sudeste Asiático","asi",103,15],
 ["indo","Indonésia","oc",114,-1],["ng","Nova Guiné","oc",144,-6],["aus","Austrália","oc",134,-25],["nz","Nova Zelândia","oc",172,-41]
];
const TI = {}; T.forEach(t => TI[t[0]] = {id:t[0], n:t[1], c:t[2], lon:t[3], lat:t[4]});
const TIDS = T.map(t => t[0]);
const LINKS = "alasca-canw canw-cane canw-euaw cane-euae cane-groen euaw-euae euaw-mex euae-mex euae-carib mex-amc amc-carib amc-col carib-ven groen-esc cane-uk col-ven col-peru col-bra ven-bra peru-bra peru-chi bra-arg chi-arg bra-afo uk-esc uk-fra fra-ibe fra-euc fra-ita euc-esc euc-ita euc-rus esc-rus ita-tur rus-tur rus-caz rus-sibw ibe-naf ita-naf naf-egi naf-afo egi-chif egi-om afo-congo chif-congo congo-afs chif-afs chif-om tur-om tur-ira om-ira ira-caz ira-ind caz-sibw caz-chn caz-mon sibw-sibe sibw-mon sibe-mon sibe-jap mon-chn chn-cor cor-jap chn-ind chn-sea ind-sea sea-indo indo-ng indo-aus ng-aus aus-nz alasca-sibe".split(" ").map(s => s.split("-"));
const SEA = new Set("cane-groen groen-esc cane-uk bra-afo ibe-naf ita-naf carib-ven sibe-jap cor-jap sea-indo indo-ng indo-aus aus-nz".split(" "));
const ADJ = {}; TIDS.forEach(id => ADJ[id] = []);
LINKS.forEach(([a,b]) => { ADJ[a].push(b); ADJ[b].push(a); });
const adj = (a,b) => ADJ[a].includes(b);

const COLORS = [
  {n:"Azul",     f:"#5B8DEF", d:"#1E4FBF"},
  {n:"Vermelho", f:"#EF6B6B", d:"#B42323"},
  {n:"Verde",    f:"#4CC27A", d:"#157A3E"},
  {n:"Roxo",     f:"#A07CF0", d:"#5B33B8"}
];
const SYM = ["▲","■","●","★"];

const OBJ = {
  c1:{t:"Conquistar totalmente a América do Norte e a Oceania.", c:["an","oc"], x:0},
  c2:{t:"Conquistar totalmente a Ásia e a América do Sul.", c:["asi","as"], x:0},
  c3:{t:"Conquistar totalmente a Europa, a América do Sul e mais um continente à sua escolha.", c:["eu","as"], x:1},
  c4:{t:"Conquistar totalmente a Europa, a Oceania e mais um continente à sua escolha.", c:["eu","oc"], x:1},
  c5:{t:"Conquistar totalmente a América do Norte e a África.", c:["an","af"], x:0},
  c6:{t:"Conquistar totalmente a Ásia e a África.", c:["asi","af"], x:0},
  c7:{t:"Conquistar totalmente a América do Sul, a África e a Oceania.", c:["as","af","oc"], x:0},
  t24:{t:"Conquistar 24 territórios à sua escolha.", n:24, m:1},
  t18:{t:"Conquistar 18 territórios com pelo menos 2 tropas em cada um.", n:18, m:2},
  k0:{t:"Eliminar o jogador AZUL. Se outro jogador eliminá-lo antes, seu objetivo passa a ser conquistar 24 territórios.", k:0},
  k1:{t:"Eliminar o jogador VERMELHO. Se outro jogador eliminá-lo antes, seu objetivo passa a ser conquistar 24 territórios.", k:1},
  k2:{t:"Eliminar o jogador VERDE. Se outro jogador eliminá-lo antes, seu objetivo passa a ser conquistar 24 territórios.", k:2},
  k3:{t:"Eliminar o jogador ROXO. Se outro jogador eliminá-lo antes, seu objetivo passa a ser conquistar 24 territórios.", k:3}
};

/* ================= FIREBASE ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uid = null, offset = 0, roomCode = null, R = null, unsubRoom = null, unsubConn = null;
const now = () => Date.now() + offset;
onValue(ref(db, ".info/serverTimeOffset"), s => offset = s.val() || 0);

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const arr = x => x ? (Array.isArray(x) ? x.filter(v => v !== null && v !== undefined) : Object.values(x)) : [];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const roll = () => 1 + Math.floor(Math.random() * 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT = null;
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
function show(id) { ["home","lobby","game"].forEach(s => $(s).classList.toggle("on", s === id)); }

/* ================= REGRAS (funções puras sobre o estado G) ================= */
function norm(g) {
  g.order = arr(g.order); g.log = arr(g.log); g.deck = arr(g.deck); g.discard = arr(g.discard);
  g.cards = g.cards || {}; g.order.forEach(u => g.cards[u] = arr(g.cards[u]));
  g.passive = g.passive || {}; g.elim = g.elim || {}; g.movable = g.movable || {}; g.obj = g.obj || {};
  g.trades = g.trades || 0;
  return g;
}
const cur = g => g.order[g.turnIdx];
const owned = (g,u) => TIDS.filter(t => g.owner[t] === u);
function contOwner(g, c) { const ts = TIDS.filter(t => TI[t].c === c); const o = g.owner[ts[0]]; return ts.every(t => g.owner[t] === o) ? o : null; }
function logp(g, s) { g.log.push(s); if (g.log.length > 40) g.log = g.log.slice(-40); }
function tradeValue(n) { const v = [4,6,8,10,12,15]; return n <= v.length ? v[n-1] : 15 + 5 * (n - v.length); }
function validSet(cs) { if (cs.length !== 3) return false; if (cs.some(c => c.s === 3)) return true; const s = cs.map(c => c.s); return (s[0]===s[1] && s[1]===s[2]) || (s[0]!==s[1] && s[1]!==s[2] && s[0]!==s[2]); }

function calcReinf(g, u) {
  const n = owned(g,u).length;
  let r = Math.max(3, Math.floor(n / 2));
  const bonus = [];
  Object.keys(CONT).forEach(c => { if (contOwner(g,c) === u) { r += CONT[c].b; bonus.push(CONT[c].n); } });
  let pen = false;
  if ((g.passive[u] || 0) >= PASSIVE_LIMIT) { r = Math.max(1, r - 1); pen = true; }
  return {r, bonus, pen};
}
function objDone(g, u) {
  const o = OBJ[g.obj[u]]; if (!o) return false;
  const mine = owned(g,u);
  if (mine.length === TIDS.length) return true;
  if (o.c) {
    if (!o.c.every(c => contOwner(g,c) === u)) return false;
    if (o.x) return Object.keys(CONT).some(c => !o.c.includes(c) && contOwner(g,c) === u);
    return true;
  }
  if (o.n) return mine.filter(t => g.troops[t] >= o.m).length >= o.n;
  return false; // objetivos de eliminação são checados na eliminação
}
function startTurn(g) {
  const u = cur(g);
  const {r, bonus, pen} = calcReinf(g,u);
  g.phase = "deploy"; g.reinf = r; g.attacked = false; g.conquered = false; g.movable = {}; g.conq = null;
  g.deadline = now() + TURN_MS;
  logp(g, `▶ Vez de ${g.names[u]}: recebe ${r} tropas${bonus.length ? " (bônus: " + bonus.join(", ") + ")" : ""}`);
  if (pen) logp(g, `⚠️ ${g.names[u]} está há ${g.passive[u]} rodadas sem atacar e recebeu 1 tropa a menos`);

async function act(fn) {
  let err = null;
  try {
    await runTransaction(ref(db, `rooms/${roomCode}/game`), g => {
      if (!g) return g;
      norm(g); err = null;
      const fail = m => { err = m; return false; };
      if (fn(g, fail) === false) return; // aborta
      return g;
    });

  if (err) toast(err);
  return !err;
}
const myTurnCheck = (g, fail) => {
  if (g.winner) return fail("A partida acabou.");
  if (cur(g) !== uid) return fail("Não é a sua vez.");
  return true;
};
function aPlace(t, n) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase !== "deploy") return fail("Fase errada.");
    if (g.cards[uid].length >= 5) return fail("Você tem 5 cartas: troque 3 antes de distribuir.");
    if (g.owner[t] !== uid) return fail("Território não é seu.");
    n = Math.min(n, g.reinf); if (n < 1) return fail("Sem tropas para distribuir.");
    g.troops[t] += n; g.reinf -= n;
  });
}
function aNext() {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase === "deploy") {
      if (g.cards[uid].length >= 5) return fail("Você tem 5 cartas: troque 3 primeiro.");
      if (g.reinf > 0) return fail(`Distribua as ${g.reinf} tropas restantes.`);
      g.phase = "attack";
    } else if (g.phase === "attack") {
      g.phase = "move"; g.conq = null; g.movable = {};
      owned(g,uid).forEach(t => { if (g.troops[t] > 1) g.movable[t] = g.troops[t] - 1; });
    } else {
      endTurn(g);
    }
  });
}
function aAttack(from, to, blitz) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase !== "attack") return fail("Não é fase de ataque.");
    if (g.owner[from] !== uid) return fail("Origem não é sua.");
    if (g.owner[to] === uid) return fail("Esse território já é seu.");
    if (!adj(from, to)) return fail("Territórios não são vizinhos.");
    if (g.troops[from] < 2) return fail("Precisa de pelo menos 2 tropas para atacar.");
    g.conq = null;
    const def = g.owner[to];
    let al = 0, dl = 0, rounds = 0, a = [], d = [];
    do {
      const ad = Math.min(3, g.troops[from] - 1), dd = Math.min(3, g.troops[to]);
      a = Array.from({length:ad}, roll).sort((x,y) => y - x);
      d = Array.from({length:dd}, roll).sort((x,y) => y - x);
      const pairs = Math.min(ad, dd);
      let aw = 0, dw = 0;
      for (let i = 0; i < pairs; i++) { if (a[i] > d[i]) aw++; else dw++; }
      g.troops[from] -= dw; g.troops[to] -= aw; al += dw; dl += aw; rounds++;
    } while (blitz && g.troops[to] > 0 && g.troops[from] > 1 && rounds < 200);
    g.attacked = true;
    const conquered = g.troops[to] <= 0;
    g.battle = {by:uid, def, from, to, a, d, al, dl, rounds, conq:conquered, ts:now()};
    logp(g, `⚔️ ${g.names[uid]} atacou ${TI[to].n} a partir de ${TI[from].n}: atacante perdeu ${al}, defensor perdeu ${dl}${rounds > 1 ? ` (${rounds} rolagens)` : ""}`);
    if (conquered) {
      g.owner[to] = uid; g.troops[to] = 1; g.troops[from] -= 1; g.conquered = true;
      logp(g, `🏳️ ${g.names[uid]} conquistou ${TI[to].n}`);
      const max = Math.min(2, g.troops[from] - 1);
      g.conq = max > 0 ? {from, to, max} : null;
      if (owned(g, def).length === 0) eliminate(g, def, uid);
      if (!g.winner && objDone(g, uid)) g.winner = uid;
      if (g.winner) { g.conq = null; logp(g, `🏆 ${g.names[g.winner]} completou o objetivo e venceu!`); }
    }
  });
}
function aConqMove(n) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    const c = g.conq; if (!c) return false;
    n = Math.max(0, Math.min(n, c.max, g.troops[c.from] - 1));
    g.troops[c.from] -= n; g.troops[c.to] += n; g.conq = null;
  });
}
function aMove(from, to, n) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase !== "move") return fail("Não é fase de remanejamento.");
    if (g.owner[from] !== uid || g.owner[to] !== uid) return fail("Os dois territórios precisam ser seus.");
    if (!adj(from, to)) return fail("Territórios não são vizinhos.");
    const m = Math.min(g.movable[from] || 0, g.troops[from] - 1);
    if (n < 1 || n > m) return fail("Quantidade inválida.");
    g.troops[from] -= n; g.troops[to] += n; g.movable[from] = (g.movable[from] || 0) - n;
  });
}
function aTrade(idxs) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase !== "deploy") return fail("Só dá para trocar cartas na fase de distribuição.");
    const hand = g.cards[uid];
    const cs = idxs.map(i => hand[i]);
    if (cs.some(c => !c) || !validSet(cs)) return fail("Combinação inválida: 3 iguais, 3 diferentes ou com coringa.");
    g.cards[uid] = hand.filter((c, i) => !idxs.includes(i));
    g.discard = g.discard.concat(cs);
    g.trades++;
    const v = tradeValue(g.trades);
    g.reinf += v;
    let extra = "";
    const own = cs.find(c => c.t !== "*" && g.owner[c.t] === uid);
    if (own) { g.troops[own.t] += 2; extra = ` +2 em ${TI[own.t].n}`; }
    logp(g, `🃏 ${g.names[uid]} trocou cartas e recebeu ${v} tropas${extra}`);
  });
}
let lastTimeoutTry = 0;
function checkTimeout() {
  const g = R && R.game; if (!g || g.winner) return;
  if (now() < g.deadline + 1500) return;
  if (Date.now() - lastTimeoutTry < 4000) return;
  lastTimeoutTry = Date.now();
  const dl = g.deadline;
  act((g2) => { if (g2.winner || g2.deadline !== dl || now() < g2.deadline + 1000) return false; autoEnd(g2); });
}

const savedName = () => ($("name").value.trim() || localStorage.getItem("cm_name") || "").slice(0,14);
function genCode() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({length:4}, () => L[Math.floor(Math.random()*L.length)]).join(""); }
async function createRoom() {

  localStorage.setItem("cm_name", name);

  if (room.meta.status !== "lobby") return toast("Essa partida já começou.");
  let ok = false, why = "";
  await runTransaction(ref(db, `rooms/${code}/players`), ps => {

    if (ps[uid]) { ok = true; return ps; }
    const used = Object.values(ps).map(p => p.color);

    const color = [0,1,2,3].find(c => !used.includes(c));

  });

let labelsFor = new Set();

/* ================= INTERAÇÃO NO MAPA ================= */
let sel = null;
function candidates() {
  const g = R && R.game; if (!g || !sel || cur(g) !== uid) return [];
  if (g.phase === "attack") return ADJ[sel].filter(t => g.owner[t] !== uid);
  if (g.phase === "move") return ADJ[sel].filter(t => g.owner[t] === uid);
  return [];
}
function terrInfo(t) {
  const g = R.game; const o = g.owner[t];
  toast(`${TI[t].n} · ${CONT[TI[t].c].n} · ${g.names[o]} · ${g.troops[t]} soldado(s)`);
}
function onTerr(t) {
  const g = R && R.game; if (!g) return;
  if (g.winner || cur(g) !== uid) { terrInfo(t); return; }
  const mine = g.owner[t] === uid;
  if (g.phase === "deploy") {
    if (!mine) return terrInfo(t);
    if (g.cards[uid].length >= 5) { toast("Você tem 5 cartas: troque 3 primeiro."); openCards(); return; }
    if (g.reinf < 1) return toast("Você já distribuiu todas as tropas. Toque em Atacar.");
    stepper(`Colocar tropas em ${TI[t].n}`, g.reinf, 1, n => aPlace(t, n), `Disponíveis: ${g.reinf}`);
    return;
  }
  if (g.phase === "attack") {
    if (sel && t === sel) { sel = null; return paint(); }
    if (mine) { if (g.troops[t] < 2) { toast("Precisa de 2+ tropas para atacar daqui."); sel = null; return paint(); } sel = t; return paint(); }
    if (sel && adj(sel, t)) { openAttack(sel, t); return; }
    if (sel) return toast("Escolha um vizinho inimigo destacado.");
    return terrInfo(t);
  }
  if (g.phase === "move") {
    if (sel && t === sel) { sel = null; return paint(); }
    if (sel && mine && adj(sel, t)) {
      const m = Math.min(g.movable[sel] || 0, g.troops[sel] - 1);
      if (m < 1) return toast("Nenhuma tropa disponível para mover daqui.");
      const from = sel;
      stepper(`Mover de ${TI[from].n} para ${TI[t].n}`, m, m, n => aMove(from, t, n), `Pode mover até ${m}`);
      return;
    }
    if (mine) { const m = Math.min(g.movable[t] || 0, g.troops[t] - 1); if (m < 1) { toast("Sem tropas móveis aqui."); sel = null; return paint(); } sel = t; return paint(); }
    return terrInfo(t);
  }
}

/* ================= BATALHA (dados na tela de todos) ================= */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML = (n, cls) => `<div class="die ${cls}">${Array.from({length:9}, (_, i) => `<i class="${PIPS[n].includes(i) ? "v" : ""}"></i>`).join("")}</div>`;
let lastBattleTs = null, battleT = null;
function showBattle(b, g) {
  const el = $("battle");
  const pairs = Math.min(b.a.length, b.d.length);
  const rollRow = (arr, cls, other, att) => arr.map((v, i) => {
    let lose = false; if (i < pairs) lose = att ? !(v > other[i]) : (other[i] > v);
    return dieHTML(v, cls + " rolling" + (i < pairs && lose ? " L" : ""));
  }).join("");
  el.innerHTML = `<div class="bt">${esc(g.names[b.by])} ⚔️ ${esc(TI[b.to].n)}${b.rounds > 1 ? ` · ${b.rounds} rolagens` : ""}</div>
    <div class="drow">${rollRow(b.a, "a", b.d, true)}<span style="margin:0 6px;color:#94a3b8">x</span>${rollRow(b.d, "d", b.a, false)}</div>
    <div class="res" id="bRes" style="visibility:hidden">Atacante −${b.al} · Defensor −${b.dl}${b.conq ? " · 🏳️ Conquistado!" : ""}</div>`;
  el.classList.add("on");
  const dice = el.querySelectorAll(".die"); const finals = [...b.a, ...b.d];
  let spins = 0;
  const spin = setInterval(() => {
    spins++;
    dice.forEach((d, i) => { const n = spins < 7 ? roll() : finals[i]; d.querySelectorAll("i").forEach((p, j) => p.classList.toggle("v", PIPS[n].includes(j))); });
    if (spins >= 7) {
      clearInterval(spin);
      dice.forEach(d => { d.classList.remove("rolling"); if (d.classList.contains("L")) d.classList.add("lose"); });
      const r = $("bRes"); if (r) r.style.visibility = "visible";
    }
  }, 80);
  clearTimeout(battleT); battleT = setTimeout(() => el.classList.remove("on"), 3200);
}

  if (modalKind === "atk") renderAttack();
  if (mine && g.conq && g.phase === "attack" && modalKind !== "conq") openConq(g.conq);
  if (modalKind === "conq" && !g.conq) closeModal();
  if (modalKind === "cards") openCards();
  if (mine && g.phase === "deploy" && g.cards[me].length >= 5 && !modalKind) openCards();
  paint();
}
setInterval(() => {
  const g = R && R.game; if (!g || !R.meta || R.meta.status !== "playing") return;
  if (g.winner) { $("gTimer").textContent = "fim"; $("gTimer").classList.remove("low"); return; }
  const ms = Math.max(0, g.deadline - now()); const s = Math.ceil(ms / 1000);
  $("gTimer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("gTimer").classList.toggle("low", s <= 20);
  checkTimeout();
}, 250);

/* ================= BOTÕES ================= */
$("bCreate").onclick = () => uid ? createRoom() : toast("Ainda conectando…");
$("bJoin").onclick = () => uid ? joinRoom($("codeIn").value) : toast("Ainda conectando…");
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") $("bJoin").click(); });
$("bShare").onclick = share;
$("bStart").onclick = startGame;
$("bLeaveLobby").onclick = leaveRoom;
$("bMenu").onclick = openMenu;
$("bCards").onclick = () => R && R.game && openCards();
$("bObj").onclick = () => R && R.game && openObj();
$("bConts").onclick = () => R && R.game && openConts();
$("bLog").onclick = () => R && R.game && openLog();
$("bNext").onclick = async () => {
  const g = R.game;
  if (g.winner) {
    if (R.meta.host === uid) { await update(ref(db, `rooms/${roomCode}`), {"meta/status":"lobby", game:null}); }
    else toast("O criador da sala pode iniciar uma nova partida.");
    return;
  }
  sel = null; await aNext();
};
svg.on("click", () => { if (sel) { sel = null; paint(); renderGame(); } });

/* ================= INÍCIO ================= */
$("name").value = localStorage.getItem("cm_name") || "";
const urlCode = new URLSearchParams(location.search).get("sala");
if (urlCode) $("codeIn").value = urlCode.toUpperCase();
buildMap();
onAuthStateChanged(auth, async user => {
  if (!user) { signInAnonymously(auth).catch(e => $("authMsg").textContent = "Erro ao conectar: " + e.message + " (o login Anônimo está ativado no Firebase?)"); return; }
  uid = user.uid; $("authMsg").textContent = "Conectado ✔";
  const saved = localStorage.getItem("cm_room");
  const target = (urlCode || saved || "").toUpperCase();
  if (target) {
    try {
      const s = await get(ref(db, `rooms/${target}/players/${uid}`));
      if (s.exists()) { enterRoom(target); return; }
      if (saved === target) localStorage.removeItem("cm_room");
    } catch (e) { $("authMsg").textContent = "Erro ao acessar o banco: " + e.message; }
  }
});
</script>
</body>
</html>
