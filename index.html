<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe9ff">
<title>Jogos</title>
<script>
  // convites antigos do War (index.html?sala=XXXX) continuam levando direto para a sala
  if (new URLSearchParams(location.search).get("sala")) location.replace("war.html" + location.search);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#cfe9ff;color:#16365c;font-family:"Baloo 2",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top))}
h1{margin:0;font:44px/1 "Lilita One",system-ui,sans-serif;letter-spacing:2px;color:#3a97e6;text-shadow:0 4px 0 #1f6fb8;text-align:center}
.sub{color:#5a7ea3;font-size:16px;font-weight:600;margin-top:-6px;text-align:center}
.game{display:flex;align-items:center;gap:16px;width:100%;max-width:380px;padding:18px;border-radius:24px;text-decoration:none;transition:transform .08s}
.game:active{transform:translateY(4px);box-shadow:none!important}
.game .ic{width:76px;height:76px;flex:none;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:44px}
.game .t{font:30px/1 "Lilita One",system-ui,sans-serif;letter-spacing:1px}
.game .d{font-size:14px;font-weight:600;margin-top:6px;line-height:1.25}
.war{background:#0f172a;color:#e5e7eb;border:3px solid #f5b700;box-shadow:0 6px 0 #8a6500}
.war .ic{background:#1a2540}
.war .t span{color:#f5b700}
.war .d{color:#94a3b8}
.ludo{background:#fff;color:#16365c;border:3px solid #a9d3f5;box-shadow:0 6px 0 #a9d3f5}
.ludo .ic{background:conic-gradient(#E53935 0 25%,#43A047 0 50%,#FDD835 0 75%,#1E88E5 0);}
.ludo .ic b{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.ludo .t .r{color:#E53935}.ludo .t .g{color:#43A047}.ludo .t .y{color:#FDD835}.ludo .t .b{color:#1E88E5}
.ludo .d{color:#5a7ea3}
.naval{background:#1f6fb8;color:#fff;border:3px solid #0d4a85;box-shadow:0 6px 0 #0d4a85}
.naval .ic{background:#4aa3e6}
.naval .t span{color:#cfe9ff}
.naval .d{color:#d6ecff}
</style>
</head>
<body>
<div class="wrap">
  <h1>ESCOLHA O JOGO</h1>
  <div class="sub">Online e ao vivo com os amigos</div>
  <a class="game war" href="war.html">
    <div class="ic">🌍</div>
    <div><div class="t">CONQUISTA <span>MUNDIAL</span></div><div class="d">Estratégia no mapa-múndi · 2 a 4 jogadores ou duplas</div></div>
  </a>
  <a class="game ludo" href="ludo.html">
    <div class="ic"><b>🎲</b></div>
    <div><div class="t"><span class="r">L</span><span class="g">U</span><span class="y">D</span><span class="b">O</span></div><div class="d">O clássico de tabuleiro · 2 a 4 jogadores ou duplas · ranking</div></div>
  </a>
  <a class="game naval" href="naval.html">
    <div class="ic">⚓</div>
    <div><div class="t">BATALHA <span>NAVAL</span></div><div class="d">Afunde a frota de todos · 2 a 4 jogadores ou duplas · ranking</div></div>
  </a>
</div>
</body>
</html>
