<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Conquista Mundial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:#111a2e;--panel2:#1a2540;--line:#2a3654;--txt:#e5e7eb;--mut:#94a3b8;--acc:#f5b700;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;overflow:auto}
.logo{font-family:Fredoka,system-ui,sans-serif;font-size:38px;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.1}
.logo span{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;text-align:center;max-width:320px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--acc)}
.btn{padding:13px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);color:#2a1d00;border-color:var(--acc)}
.btn.red{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.lbl{font-size:13px;color:var(--mut)}
.code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff}
.on-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto}
.on-dot.off{background:#64748b}
/* game */
#game{background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:14px;white-space:nowrap}
.top .ttl small{color:var(--mut);font-weight:500}
.timer{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--panel2);font-size:14px}
.timer.low{background:#7f1d1d;color:#fff}
.ibtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16px}
.chips{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--panel2);font-size:12px;border:2px solid transparent;white-space:nowrap}
.chip.cur{border-color:var(--acc)}
.chip.dead{opacity:.4;text-decoration:line-through}
.chip .dot{width:11px;height:11px;border-width:1.5px}
#mapbox{flex:1;position:relative;overflow:hidden;min-height:0;background:#9cc9e8}
#map{width:100%;height:100%;display:block;touch-action:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.92);color:#0f172a;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0f172a;font-weight:600}
.bottom{background:var(--panel);border-top:1px solid var(--line);padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.banner{font-size:14px;line-height:1.35;min-height:20px}
.banner b{color:var(--acc)}
.warn{font-size:12px;color:#fca5a5}
.acts{display:flex;gap:6px}
.acts .btn{padding:10px 6px;font-size:13px;flex:1}
.acts .btn.pri{flex:1.6}
/* modal */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.back.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:80vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.step{display:flex;align-items:center;justify-content:center;gap:14px}
.step button{width:52px;height:52px;border-radius:14px;background:var(--panel2);font-size:26px;font-weight:700}
.step .val{font-size:36px;font-weight:800;min-width:70px;text-align:center}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.vs .side{flex:1;padding:10px;border-radius:12px;background:var(--panel2);text-align:center}
.vs .side b{display:block;font-size:24px}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2);font-size:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tcard .sym{font-size:26px;line-height:1}
.tcard.sel{border-color:var(--acc);background:#2b2410}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px}
.list .it{padding:9px 11px;background:var(--panel2);border-radius:10px;display:flex;align-items:center;gap:8px}
.list .it .r{margin-left:auto;color:var(--mut);font-size:13px}
/* battle overlay */
#battle{position:fixed;left:50%;top:max(110px,calc(env(safe-area-inset-top) + 100px));z-index:30;transform:translateX(-50%);background:rgba(15,23,42,.96);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:none;flex-direction:column;gap:10px;align-items:center;width:min(340px,92%);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.duel{display:flex;align-items:stretch;justify-content:center;gap:10px;width:100%}
.dside{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);transition:all .3s}
.dside .who{font-weight:800;font-size:14px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dside .where{font-size:11px;color:var(--mut)}
.dside .out{font-size:13px;font-weight:800;min-height:18px}
.dside.win{border-color:#22c55e;background:#0f2e1c}
.dside.win .out{color:#4ade80}
.dside.lose{border-color:#ef4444;background:#3a1212}
.dside.lose .out{color:#f87171}
.vsx{align-self:center;font-weight:900;color:var(--acc);font-size:18px}
.die.big{width:62px;height:62px;padding:8px;border-radius:12px}
.die.big i{width:11px;height:11px}
.die.q{display:flex;align-items:center;justify-content:center;font-size:30px;color:#111827;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#battle.on{display:flex}
#battle .bt{font-size:12px;color:var(--mut);text-align:center}
.drow{display:flex;gap:6px;align-items:center}
.die{width:34px;height:34px;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.die i{width:6px;height:6px;border-radius:50%;background:#fff;place-self:center;visibility:hidden}
.die i.v{visibility:visible}
.die.a{background:#dc2626}
.die.d{background:#e5e7eb}
.die.d i{background:#111827}
.die.lose{opacity:.35}
.die.rolling{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.res{font-size:14px;font-weight:700}
#turnPop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(15,23,42,.35)}
#turnPop.on{display:flex}
.tp-box{background:var(--acc);color:#2a1d00;border-radius:20px;padding:20px 30px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .35s ease-out;max-width:85%}
.tp-box b{display:block;font-size:40px;font-weight:900;letter-spacing:3px;line-height:1.05}
.tp-box span{display:block;font-size:17px;font-weight:700;margin-top:6px}
.tp-box small{display:block;font-size:13px;font-weight:600;margin-top:6px;opacity:.8}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:42vh;min-height:120px;overflow-y:auto;padding:4px 2px;-webkit-user-select:text;user-select:text}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;background:var(--panel2);font-size:14px;align-self:flex-start;line-height:1.35;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#2b2410;border:1px solid #5c4708}
.msg small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:7px 11px;border-radius:999px;background:var(--panel2);font-size:13px;border:1px solid var(--line)}
.badge{display:inline-block;min-width:17px;padding:1px 5px;border-radius:999px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;margin-left:3px;vertical-align:top}
/* dado 3D */
#diceLayer{position:fixed;inset:0;pointer-events:none;z-index:40;perspective:800px}
.dw{position:absolute;left:0;top:0;width:54px;height:54px;will-change:transform}
.dshadow{position:absolute;left:5px;top:50px;width:44px;height:11px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(3px)}
.cube{width:54px;height:54px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:11px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28),inset 0 -4px 0 rgba(0,0,0,.15);backface-visibility:hidden}
.cube.a .face{background:#e11d2e}.cube.a .face i{background:#fff}
.cube.d .face{background:#f8fafc}.cube.d .face i{background:#111}
.face i{width:9px;height:9px;border-radius:50%;place-self:center;visibility:hidden}.face i.v{visibility:visible}
.f1{transform:translateZ(27px)}.f6{transform:rotateY(180deg) translateZ(27px)}.f3{transform:rotateY(90deg) translateZ(27px)}.f4{transform:rotateY(-90deg) translateZ(27px)}.f5{transform:rotateX(90deg) translateZ(27px)}.f2{transform:rotateX(-90deg) translateZ(27px)}
.dnum{position:absolute;left:50%;top:-38px;transform:translateX(-50%) scale(.4);font:700 32px Fredoka,system-ui,sans-serif;color:#fff;text-shadow:0 3px 0 #000,0 0 8px rgba(0,0,0,.8);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.dnum.on{opacity:1;transform:translateX(-50%) scale(1)}
/* cabeçalho do ataque */
.bh{font:600 16px Fredoka,system-ui,sans-serif;text-align:center}
.bs{font-size:13px;color:var(--mut);text-align:center;margin-top:-6px}
.score{display:flex;align-items:center;justify-content:center;gap:12px;font:700 30px Fredoka,system-ui,sans-serif}
.score .sv{min-width:48px;text-align:center;padding:2px 10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);transition:all .25s}
.score .sv.win{border-color:#22c55e;background:#0f2e1c;color:#4ade80}
.score .sv.lose{border-color:#ef4444;background:#3a1212;color:#f87171}
.verdict{font:700 15px Fredoka,system-ui,sans-serif;text-align:center;letter-spacing:.5px}
/* telas grandes (sua vez, continente, ordem) */
#bigPop{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:18px;backdrop-filter:blur(2px)}
#bigPop.on{display:flex}
.bp{width:min(420px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1e293b,#0f172a);border:3px solid var(--acc);border-radius:24px;padding:20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .4s ease-out;display:flex;flex-direction:column;gap:12px}
.bp-title{font:700 46px/1 Fredoka,system-ui,sans-serif;color:var(--acc);letter-spacing:2px;text-shadow:0 4px 0 #6b4f00}
.bp-sub{font:600 20px Fredoka,system-ui,sans-serif}
.bp-sub b{color:var(--acc);font-size:26px}
.bp-small{font-size:13px;color:var(--mut)}
.bp-box{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:14px;display:flex;flex-direction:column;gap:6px}
.bp-box h4{margin:0;font:600 14px Fredoka,system-ui,sans-serif;color:var(--acc)}
.bar{height:12px;border-radius:999px;background:#0b1222;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f5b700,#22c55e);border-radius:999px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.minicard{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#2b2410;border:1px solid #5c4708;font-weight:600}
.bp .btn{font:700 18px Fredoka,system-ui,sans-serif;padding:14px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#020617;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90vw;text-align:center;border:1px solid var(--line)}
#toast.on{display:block}
.obj{font-size:16px;line-height:1.45;padding:14px;border-radius:12px;background:#2b2410;border:1px solid #5c4708}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen on" id="home">
  <div class="center">
    <div class="logo">CONQUISTA<br><span>MUNDIAL</span></div>
    <div class="sub">Domine o mundo com seus amigos. De 2 a 4 jogadores, online e ao vivo.</div>
    <div class="card">
      <div class="lbl">Seu apelido</div>
      <input class="inp" id="name" maxlength="14" placeholder="Ex.: General Zé">
      <button class="btn pri" id="bCreate">Criar sala</button>
    </div>
    <div class="card">
      <div class="lbl">Entrar numa sala</div>
      <div class="row"><input class="inp" id="codeIn" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="btn" id="bJoin" style="flex:.6">Entrar</button></div>
    </div>
    <div class="sub" id="authMsg">Conectando…</div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="lobby">
  <div class="center">
    <div class="lbl">Código da sala</div>
    <div class="code" id="lCode">----</div>
    <button class="btn" id="bShare">Copiar convite</button>
    <div class="card">
      <div class="lbl">Modo de jogo</div>
      <div class="row" id="lMode"><button class="btn" data-m="solo">Individual</button><button class="btn" data-m="duo">Dupla x Dupla</button></div>
      <div class="lbl">Jogadores (<span id="lCount">0</span>/4)</div>
      <div class="plist" id="lPlayers"></div>
    </div>
    <button class="btn pri" id="bStart" style="width:100%;max-width:360px">Começar partida</button>
    <div class="sub" id="lWait"></div>
    <button class="btn" id="bLeaveLobby" style="width:100%;max-width:360px">Sair da sala</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="top">
    <div class="ttl" id="gTitle">Sala ---- <small></small></div>
    <div class="timer" id="gTimer">2:00</div>
    <button class="ibtn" id="bMenu" aria-label="Menu">☰</button>
  </div>
  <div class="chips" id="gChips"></div>
  <div id="mapbox">
    <svg id="map" viewBox="0 0 680 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="loading" id="mapLoading">Carregando mapa…</div>
    <div class="zoom">
      <button id="zIn" aria-label="Aproximar">+</button>
      <button id="zOut" aria-label="Afastar">−</button>
      <button id="zReset" aria-label="Centralizar" style="font-size:15px">⤢</button>
    </div>
    <div id="battle"></div>
    <div id="turnPop"><div class="tp-box"><b>SUA VEZ</b><span id="tpSub"></span><small id="tpNote"></small></div></div>
  </div>
  <div class="bottom">
    <div class="banner" id="gBanner"></div>
    <div class="warn" id="gWarn"></div>
    <div class="acts">
      <button class="btn" id="bCards">🃏 <span id="nCards">0</span></button>
      <button class="btn" id="bObj">🎯</button>
      <button class="btn" id="bConts">🌍</button>
      <button class="btn" id="bLog">📜</button>
      <button class="btn" id="bChat" style="display:none">💬<span id="nChat"></span></button>
      <button class="btn pri" id="bNext">Próxima fase</button>
    </div>
  </div>
</div>

<div class="back" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="diceLayer"></div>
<div id="bigPop"><div class="bp" id="bigBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

}
function objDone(g, u) {

  const m = mates(g, u);

  if (mine.length === TIDS.length) return true;

    if (!o.c.every(c => holds(g,c,u))) return false;

async function act(fn) {
  let err = null;
  try {
    await runTransaction(ref(db, `rooms/${roomCode}/game`), g => {
      if (!g) return g;
      norm(g); err = null;
      const fail = m => { err = m; return false; };
      if (fn(g, fail) === false) return; // aborta
      return g;
    });
  } catch (e) { err = "Erro de conexão: " + e.message; }
  if (err) toast(err);
  return !err;
}
const myTurnCheck = (g, fail) => {
  if (g.winner) return fail("A partida acabou.");
  if (g.started === false) return fail("Aguardando todos confirmarem o objetivo.");
  if (cur(g) !== uid) return fail("Não é a sua vez.");
  return true;
};
function aPlace(t, n) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.phase !== "deploy") return fail("Fase errada.");
    if (g.cards[uid].length >= 5) return fail("Você tem 5 cartas: troque 3 antes de distribuir.");
    if (g.owner[t] !== uid) return fail("Território não é seu.");
    n = Math.min(n, g.reinf); if (n < 1) return fail("Sem tropas para distribuir.");
    g.troops[t] += n; g.reinf -= n;
    winCheck(g, uid);
  });
}
function aNext() {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.duel) return fail("Aguarde o defensor jogar o dado.");
    if (g.phase === "deploy") {
      if (g.cards[uid].length >= 5) return fail("Você tem 5 cartas: troque 3 primeiro.");
      if (g.reinf > 0) return fail(`Distribua as ${g.reinf} tropas restantes.`);
      if (g.round === 1) enterMove(g); else g.phase = "attack";
    } else if (g.phase === "attack") {
      enterMove(g);
    } else {
      endTurn(g);
    }
  });
}
function enterMove(g) {
  g.phase = "move"; g.conq = null; g.movable = {};
  owned(g, cur(g)).forEach(t => { if (g.troops[t] > 1) g.movable[t] = g.troops[t] - 1; });

// Início: cada jogador joga 1 dado; quem tirar mais começa (empate: quem jogou primeiro fica na frente)
function aReady() {

    if (g.started !== false) return false;
    g.ready = g.ready || {};
    if (g.ready[uid]) return fail("Você já jogou o seu dado.");
    g.ready[uid] = {v: roll(), ts: now()};
    if (g.order.every(u => g.ready[u])) finalizeOrder(g);
  });
}
function finalizeOrder(g) {
  const rk = (a, b) => (g.ready[b].v - g.ready[a].v) || (g.ready[a].ts - g.ready[b].ts);
  const sorted = g.order.slice().sort(rk);
  if (isDuo(g)) {
    const A = sorted.filter(u => g.team[u] === g.team[sorted[0]]), B = sorted.filter(u => g.team[u] !== g.team[sorted[0]]);
    g.order = [A[0], B[0], A[1], B[1]];
  } else g.order = sorted;
  g.turnIdx = 0; g.round = 1; g.started = true;

// Duelo: o atacante joga o dado dele (cria o duelo); o defensor joga o dele no próprio celular (resolve).
// Se o defensor não jogar em 15 s, o dado dele é jogado automaticamente.
function aAttack(from, to) {
  return act((g, fail) => {
    if (myTurnCheck(g, fail) === false) return false;
    if (g.round === 1) return fail("Ataques liberados só a partir da 2ª rodada.");
    if (g.phase !== "attack") return fail("Não é fase de ataque.");
    if (g.duel) return fail("Aguarde o defensor jogar o dado.");
    if (g.owner[from] !== uid) return fail("Origem não é sua.");
    if (g.owner[to] === uid) return fail("Esse território já é seu.");
    if (isAlly(g, uid, g.owner[to])) return fail("Esse território é do seu parceiro.");
    if (!adj(from, to)) return fail("Territórios não são vizinhos.");
    if (g.troops[from] < 2) return fail("Precisa de pelo menos 2 tropas para atacar.");
    if (!window.__fast && g.battle && g.battle.by === uid && now() - g.battle.ts < 1500) return fail("Espere o dado parar de rolar.");

    g.duel = {by:uid, def:g.owner[to], from, to, a:roll(), ts:now()};
  });

    resolveDuel(g, roll(), false);

function resolveDuel(g, d, auto) {

  g.deadline += Math.min(DEF_MS, Math.max(0, now() - D.ts));   // o tempo esperando o defensor não conta para o atacante
  const atkWins = a > d;                                       // empate: defensor vence
  const al = atkWins ? 0 : 1, dl = atkWins ? 1 : 0;
  g.troops[from] -= al; g.troops[to] -= dl;
  g.attacked = true;
  const conquered = g.troops[to] <= 0;
  g.battle = {by:A, def, from, to, a:[a], d:[d], al, dl, rounds:1, conq:conquered, auto:!!auto, ts:now()};
  logp(g, `🎲 ${g.names[A]} (${a}) x ${g.names[def]} (${d})${auto ? " [automático]" : ""} em ${TI[to].n}: ${atkWins ? g.names[def] : g.names[A]} perdeu 1 soldado`);
  if (conquered) {

    g.owner[to] = A; g.troops[to] = 1; g.troops[from] -= 1; g.conquered = true;
    logp(g, `🏳️ ${g.names[A]} conquistou ${TI[to].n}`);
    const gained = Object.keys(CONT).filter(c => holds(g, c, A) && !before.includes(c));
    if (gained.length) { g.ann = {u:A, cs:gained, ts:now()}; logp(g, `🌍 ${isDuo(g) ? teamName(g, A) : g.names[A]} dominou ${gained.map(c => CONT[c].n).join(" e ")}!`); }

    if (owned(g, def).length === 0) eliminate(g, def, A);

let labelsFor = new Set(), cullRaf = 0;
// tamanhos definidos em pixels de tela, para ficarem iguais no celular e no computador
function scaleMarks() {
  if (!mapReady) return;
  const k = zoomK, u = px => px / (pxPerUnit * k);
  const rPx = Math.min(11, 6.5 * Math.pow(k, .3));
  nodeSel.select(".bub").attr("r", u(rPx)).attr("stroke-width", u(1.4));
  nodeSel.select(".num").attr("font-size", u(rPx * 1.12));
  const fPx = Math.min(10, 6 * Math.pow(k, .28));
  nodeSel.select(".tn").attr("font-size", u(fPx)).attr("y", u(rPx + 1.5)).attr("stroke-width", u(2));
  gRoot.select(".b1").attr("stroke-width", u(.9));
  gRoot.select(".b2").attr("stroke-width", u(.8));
  gRoot.selectAll(".cband").attr("stroke-width", u(3));
  gRoot.select(".b3").attr("stroke-width", u(.6));
  gRoot.select(".sea").attr("stroke-width", u(1)).attr("stroke-dasharray", `${u(3)} ${u(3)}`);
  gRoot.select(".cl").selectAll("text").attr("font-size", u(Math.min(30, 11 * Math.pow(k, .6)))).attr("opacity", k < 2.2 ? .17 : Math.max(0, .17 - (k - 2.2) * .06));

// esconde nomes que ficariam por cima de outros (os do território selecionado têm prioridade)
function cullLabels() {
  if (!mapReady) return;
  const tr = d3.zoomTransform(svg.node()), k = tr.k, f = pxPerUnit;
  const rPx = Math.min(11, 6.5 * Math.pow(k, .3)), fPx = Math.min(10, 6 * Math.pow(k, .28));
  const sp = t => [(P[t][0] * k + tr.x) * f, (P[t][1] * k + tr.y) * f];
  const boxes = TIDS.map(t => { const [x, y] = sp(t); return [x - rPx, y - rPx, x + rPx, y + rPx, t]; });
  const hit = (b) => boxes.some(o => !(b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]) && o[4] !== b[4]);
  const prio = [...labelsFor, ...TIDS.filter(t => !labelsFor.has(t))];
  const vis = new Set();
  prio.forEach(t => {
    const [x, y] = sp(t); const w = TI[t].n.length * fPx * .56;
    const b = [x - w / 2, y + rPx + 1.5, x + w / 2, y + rPx + 1.5 + fPx, t];
    if (labelsFor.has(t) || !hit(b)) { vis.add(t); boxes.push(b); }
  });
  nodeSel.select(".tn").attr("display", t => vis.has(t) ? null : "none");
}
let prevOwner = {};
function paint() {
  if (!mapReady) return;
  const g = R && R.game;
  const cand = candidates();
  labelsFor = new Set(sel ? [sel, ...cand] : []);
  if (focusTerr) { focusTerr.forEach(t => labelsFor.add(t)); }
  const deployMine = !focusTerr && g && !g.winner && g.started !== false && cur(g) === uid && g.phase === "deploy" && g.reinf > 0;
  if (deployMine) owned(g, uid).forEach(t => cand.push(t));
  const dim = !!sel || deployMine;
  landSel.each(function () {
    const t = this.getAttribute("data-t"); const el = d3.select(this);
    const o = g && g.owner[t]; let col = o ? COLORS[g.col[o]].f : "#d6d3c4";
    if (focusTerr && !focusTerr.includes(t)) col = "#a8a29e";
    const changed = g && prevOwner[t] && prevOwner[t] !== o;
    if (changed) el.attr("fill", "#ffffff").transition().duration(700).attr("fill", col).attr("stroke", col);
    else el.interrupt().attr("fill", col).attr("stroke", col);
    el.attr("opacity", dim && t !== sel && !cand.includes(t) ? 0.4 : 1);
  });
  if (g) { const po = {}; TIDS.forEach(t => po[t] = g.owner[t]); setTimeout(() => prevOwner = po, 0); }
  nodeSel.each(function (t) {
    const el = d3.select(this); const o = g && g.owner[t]; const n = g ? g.troops[t] : 0;
    const gold = n >= GOLD_AT; const c = o ? COLORS[g.col[o]] : {f:"#999", d:"#333"};
    el.select(".bub").attr("fill", gold ? "#F5B700" : "#ffffff").attr("stroke", t === sel ? "#f5b700" : (gold ? "#8A6100" : c.d));
    el.select(".num").attr("fill", gold ? "#3d2a00" : c.d).text(g ? n : "");
    el.attr("opacity", focusTerr ? (focusTerr.includes(t) ? 1 : 0.3) : (dim && t !== sel && !cand.includes(t) ? 0.45 : 1));
  });
  if (sel) { landSel.filter(function () { return this.getAttribute("data-t") === sel; }).attr("stroke", "#f5b700").attr("stroke-width", 2 / Math.sqrt(zoomK)).raise(); }

}

let sel = null;
function candidates() {
  const g = R && R.game; if (!g || !sel || cur(g) !== uid) return [];
  if (g.phase === "attack") return ADJ[sel].filter(t => g.owner[t] !== uid && !isAlly(g, uid, g.owner[t]));
  if (g.phase === "move") return ADJ[sel].filter(t => g.owner[t] === uid || isAlly(g, uid, g.owner[t]));
  return [];
}
function terrInfo(t) {
  const g = R.game; const o = g.owner[t];
  toast(`${TI[t].n} · ${CONT[TI[t].c].n} · ${g.names[o]}${isAlly(g, uid, o) ? " (seu parceiro)" : ""} · ${g.troops[t]} soldado(s)`);
}
function onTerr(t) {
  const g = R && R.game; if (!g) return;
  if (g.winner || g.started === false || cur(g) !== uid) { terrInfo(t); return; }
  const mine = g.owner[t] === uid;
  if (g.phase === "deploy") {
    if (!mine) return terrInfo(t);
    if (g.cards[uid].length >= 5) { toast("Você tem 5 cartas: troque 3 primeiro."); openCards(); return; }
    if (g.reinf < 1) return toast("Você já distribuiu todas as tropas. Toque em Atacar.");
    stepper(`Colocar tropas em ${TI[t].n}`, g.reinf, 1, n => aPlace(t, n), `Disponíveis: ${g.reinf}`);
    return;
  }
  if (g.phase === "attack") {
    if (sel && t === sel) { sel = null; return renderGame(); }
    if (mine) { if (g.troops[t] < 2) { toast("Precisa de 2+ tropas para atacar daqui."); sel = null; return renderGame(); } sel = t; return renderGame(); }
    if (isAlly(g, uid, g.owner[t])) return toast(`${TI[t].n} é do seu parceiro: não dá para atacar.`);
    if (sel && adj(sel, t)) { openAttack(sel, t); return; }
    if (sel) return toast("Escolha um vizinho inimigo destacado.");
    return terrInfo(t);
  }
  if (g.phase === "move") {
    if (sel && t === sel) { sel = null; return renderGame(); }
    if (sel && t !== sel && (mine || isAlly(g, uid, g.owner[t])) && adj(sel, t)) {
      const m = Math.min(g.movable[sel] || 0, g.troops[sel] - 1);
      if (m < 1) return toast("Nenhuma tropa disponível para mover daqui.");
      const from = sel;
      stepper(`Mover de ${TI[from].n} para ${TI[t].n}${g.owner[t] !== uid ? " (parceiro)" : ""}`, m, m, n => aMove(from, t, n), `Pode mover até ${m}`);
      return;
    }
    if (mine) { const m = Math.min(g.movable[t] || 0, g.troops[t] - 1); if (m < 1) { toast("Sem tropas móveis aqui."); sel = null; return renderGame(); } sel = t; return renderGame(); }
    return terrInfo(t);
  }
}

let chatKey = null, chatUnsub = null, chatMsgs = [], chatSeen = 0, chatUnread = 0, chatFirst = true;
const QUICK = ["Me manda tropas! 🙏", "Vou atacar aqui ⚔️", "Cuidado, estão vindo! ⚠️", "Segura aí 🛡️", "Boa, parceiro! 👏"];
function stopChat() { if (chatUnsub) chatUnsub(); chatUnsub = null; chatKey = null; chatMsgs = []; chatUnread = 0; chatFirst = true; updChatBadge(); }
function syncChat() {
  const g = R && R.game;
  const key = g && isDuo(g) && g.team[uid] !== undefined ? "t" + g.team[uid] : null;
  if (key === chatKey) return;
  stopChat(); if (!key) return;
  chatKey = key;
  chatUnsub = onValue(query(ref(db, `rooms/${roomCode}/chat/${key}`), limitToLast(60)), s => {
    const list = []; s.forEach(c => { list.push(c.val()); });
    chatMsgs = list;
    const fresh = list.filter(m => m.ts > chatSeen && m.u !== uid);
    if (chatFirst) { chatFirst = false; chatSeen = Math.max(chatSeen, ...list.map(m => m.ts), 0); }
    else if (fresh.length) {
      if (modalKind === "chat") chatSeen = Math.max(...list.map(m => m.ts));
      else { chatUnread += fresh.length; chatSeen = Math.max(...list.map(m => m.ts)); const m = fresh[fresh.length - 1]; toast(`💬 ${m.n}: ${m.m}`, 3500); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }
    }
    updChatBadge();
    if (modalKind === "chat") drawChat();
  }, () => { if (chatUnsub) chatUnsub(); chatUnsub = null; });
}
function updChatBadge() { const n = $("nChat"); if (n) n.innerHTML = chatUnread ? `<span class="badge">${chatUnread > 9 ? "9+" : chatUnread}</span>` : ""; }
function drawChat() {
  const box = $("chatList"); if (!box) return;
  box.innerHTML = chatMsgs.length ? chatMsgs.map(m => `<div class="msg ${m.u === uid ? "me" : ""}"><small>${esc(m.n)}</small>${esc(m.m)}</div>`).join("") : '<div class="lbl" style="text-align:center;margin:auto">Nenhuma mensagem ainda. Só você e seu parceiro veem este chat.</div>';
  box.scrollTop = box.scrollHeight;
}
async function sendChat(text) {
  text = (text || "").trim().slice(0, 200); if (!text || !chatKey) return;
  if (isThomas(text)) return toast("🎖️ A palavra Thomas está reservada para um futuro general!", 3500);
  try { await push(ref(db, `rooms/${roomCode}/chat/${chatKey}`), {u:uid, n:R.game.names[uid], m:text, ts:now()}); }
  catch (e) { toast("Não foi possível enviar: confira as regras do Firebase."); }
}
function openChat() {
  const g = R.game; const partner = mates(g, uid).find(x => x !== uid);
  chatUnread = 0; updChatBadge();
  openModal(`<h3>💬 Chat da ${teamName(g, uid)}</h3>
    <div class="lbl">Só você e <b style="color:${COLORS[g.col[partner]].f}">${esc(g.names[partner])}</b> veem estas mensagens.</div>
    <div class="msgs" id="chatList"></div>
    <div class="quick">${QUICK.map((q, i) => `<button data-q="${i}">${q}</button>`).join("")}</div>
    <div class="row"><input class="inp" id="chatIn" maxlength="200" placeholder="Mensagem para o parceiro…" style="flex:1"><button class="btn pri" id="chatSend" style="flex:none;width:76px">Enviar</button></div>
    <button class="btn" id="chatClose">Fechar</button>`, "chat");
  drawChat();

  $("chatSend").onclick = send;

const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML = (n, cls) => `<div class="die ${cls}">${Array.from({length:9}, (_, i) => `<i class="${PIPS[n].includes(i) ? "v" : ""}"></i>`).join("")}</div>`;
let lastBattleTs = null, lastDuelTs = null, battleT = null, spinT = null;
function floatText(t, txt, color) {
  if (!mapReady || !P[t]) return;
  const u = px => px / (pxPerUnit * zoomK);
  const el = gRoot.append("text").attr("x", P[t][0]).attr("y", P[t][1] - u(12)).attr("text-anchor", "middle")
    .attr("font-size", u(18)).attr("font-weight", 700).attr("font-family", "Fredoka,system-ui,sans-serif")
    .attr("fill", color).attr("stroke", "#ffffff").attr("stroke-width", u(3.5)).attr("paint-order", "stroke").text(txt);
  el.transition().duration(1500).ease(d3.easeCubicOut).attr("y", P[t][1] - u(46)).attr("opacity", 0).remove();
}
// ---- dado 3D: é "jogado" na tela, quica, cai mostrando o número e dá um zoom
const FACE_ROT = {1:[0,0], 6:[0,180], 3:[0,-90], 4:[0,90], 5:[-90,0], 2:[90,0]};
const faceHTML = n => `<div class="face f${n}">${Array.from({length:9}, (_, i) => `<i class="${PIPS[n].includes(i) ? "v" : ""}"></i>`).join("")}</div>`;
function clearDice() { $("diceLayer").innerHTML = ""; }
function throwDie(v, kind, x, y, fromLeft) {
  const L = $("diceLayer");
  const w = document.createElement("div"); w.className = "dw";
  w.innerHTML = `<div class="dshadow"></div><div class="cube ${kind}">${[1,2,3,4,5,6].map(faceHTML).join("")}</div><div class="dnum">${v}</div>`;
  L.appendChild(w);
  const cube = w.querySelector(".cube");
  const hb = $("battle").classList.contains("on") ? $("battle").getBoundingClientRect().bottom + 50 : 90;   // nunca cai em cima do painel
  x = Math.max(10, Math.min(innerWidth - 66, x)); y = Math.max(hb, Math.min(innerHeight - 170, y));
  const x0 = fromLeft ? -70 : innerWidth + 20, y0 = innerHeight * .78;
  const mx = (x0 + x) / 2, my = Math.min(y0, y) - 150;
  const [rx, ry] = FACE_ROT[v];
  const sx = rx + 360 * (2 + Math.floor(Math.random() * 2)) + 90 * Math.floor(Math.random() * 4) * 0, sy = ry + 360 * (2 + Math.floor(Math.random() * 2));
  const rz0 = (Math.random() * 300 + 200) * (fromLeft ? 1 : -1);
  const T = 1150;
  const path = w.animate([
    {transform:`translate(${x0}px,${y0}px) scale(.7)`},
    {transform:`translate(${mx}px,${my}px) scale(1.3)`, offset:.42},
    {transform:`translate(${x}px,${y}px) scale(1)`, offset:.7},
    {transform:`translate(${x + (fromLeft ? 8 : -8)}px,${y - 22}px) scale(1.06)`, offset:.83},
    {transform:`translate(${x}px,${y}px) scale(1)`}
  ], {duration:T, easing:"cubic-bezier(.25,.6,.35,1)", fill:"forwards"});
  cube.animate([
    {transform:`rotateX(${sx}deg) rotateY(${sy}deg) rotateZ(${rz0}deg)`},
    {transform:`rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(0deg)`}
  ], {duration:T, easing:"cubic-bezier(.15,.6,.25,1)", fill:"forwards"});
  return path.finished.then(() => {
    const z = w.animate([
      {transform:`translate(${x}px,${y}px) scale(1)`},
      {transform:`translate(${x}px,${y}px) scale(1.9)`, offset:.35},
      {transform:`translate(${x}px,${y}px) scale(1.55)`}
    ], {duration:650, easing:"ease-out", fill:"forwards"});
    w.querySelector(".dnum").classList.add("on");
    try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
    return z.finished.then(() => w);
  });
}
function terrScreen(t) {
  const pt = svg.node().createSVGPoint(); pt.x = P[t][0]; pt.y = P[t][1];
  const q = pt.matrixTransform(gRoot.node().getScreenCTM()); return [q.x, q.y];
}
// cada dado cai do lado de fora do seu território (atacante de um lado, defensor do outro), sem se sobrepor
function diceSpot(from, to, atk) {
  const [fx, fy] = terrScreen(from), [tx, ty] = terrScreen(to);
  const dx = tx - fx, dy = ty - fy;
  if (Math.abs(dx) >= Math.abs(dy) * .6) { const s = Math.sign(dx) || 1; return atk ? [fx - s * 78 - 27, fy - 27] : [tx + s * 78 - 27, ty - 27]; }
  const s = Math.sign(dy) || 1; return atk ? [fx - 27, fy - s * 78 - 27] : [tx - 27, ty + s * 78 - 27];
}
// ---- câmera e foco no ataque
let focusTerr = null, savedT = null, unfocusT = null, animQ = Promise.resolve();
const enqueue = fn => (animQ = animQ.then(fn).catch(() => {}));
function focusBattle(from, to) {
  clearTimeout(unfocusT);
  focusTerr = [from, to]; paint();
  if (!savedT) savedT = d3.zoomTransform(svg.node());
  const cx = (P[from][0] + P[to][0]) / 2, cy = (P[from][1] + P[to][1]) / 2;
  const dx = Math.abs(P[from][0] - P[to][0]) + 30, dy = Math.abs(P[from][1] - P[to][1]) + 30;
  const k = Math.max(1.6, Math.min(5, VBW / dx / 2.2, VBH / dy / 3));
  const t = d3.zoomIdentity.translate(VBW / 2 - k * cx, VBH * .55 - k * cy).scale(k);
  svg.transition().duration(650).call(zoom.transform, t);
  return new Promise(res => setTimeout(res, 680));
}
function unfocus() {
  focusTerr = null; clearDice(); $("battle").classList.remove("on"); paint();
  if (savedT) { svg.transition().duration(700).call(zoom.transform, savedT); savedT = null; }
}
function battleHeader(by, def, from, to, g, aTxt, dTxt, res) {
  const ac = COLORS[g.col[by]].f, dc = COLORS[g.col[def]].f;
  const el = $("battle");
  el.innerHTML = `<div class="bh">⚔️ <b style="color:${ac}">${esc(g.names[by])}</b> ataca <b style="color:${dc}">${esc(g.names[def])}</b></div>
    <div class="bs">(${esc(TI[from].n)} x ${esc(TI[to].n)})</div>
    <div class="score"><span class="sv" id="svA" style="color:${ac}">${aTxt}</span><span>-</span><span class="sv" id="svD" style="color:${dc}">${dTxt}</span></div>
    <div class="verdict" id="bVer"></div><div class="res" id="bRes" style="text-align:center;font-size:13px;color:var(--mut)">${res || ""}</div>`;
  el.classList.add("on");
}
// 1ª parte: o atacante jogou o dado; o defensor ainda vai jogar
function showDuelPending(D, g, animate) {
  clearTimeout(unfocusT);
  const nm = x => esc(g.names[x]);
  enqueue(async () => {
    clearDice();
    battleHeader(D.by, D.def, D.from, D.to, g, "?", "?", `${nm(D.by)} está jogando o dado…`);
    await focusBattle(D.from, D.to);
    if (animate) { const [x, y] = diceSpot(D.from, D.to, true); await throwDie(D.a, "a", x, y, true); }
    const sa = $("svA"); if (sa) sa.textContent = D.a;
    const r = $("bRes"); if (r) r.innerHTML = `${nm(D.by)} tirou <b style="color:var(--txt)">${D.a}</b>. Aguardando <b style="color:var(--txt)">${nm(D.def)}</b> jogar o dado…`;
  });
}
// 2ª parte: o defensor jogou; mostra a conta (ex.: 6-5 atacante ganha) e quem perdeu soldado
function showBattle(b, g) {
  const nm = x => esc(g.names[x]);
  const a = b.a[0], d = b.d[0], atkWins = b.dl > 0;
  enqueue(async () => {
    if (!focusTerr || focusTerr[0] !== b.from || focusTerr[1] !== b.to || !$("svA")) {
      battleHeader(b.by, b.def, b.from, b.to, g, a, "?", ""); await focusBattle(b.from, b.to);
    }
    const r = $("bRes"); if (r) r.innerHTML = `${nm(b.def)} ${b.auto ? "demorou: dado jogado automaticamente" : "está jogando o dado"}…`;
    const [x, y] = diceSpot(b.from, b.to, false); await throwDie(d, "d", x, y, false);
    const sa = $("svA"), sd = $("svD"), ver = $("bVer"), rr = $("bRes");
    if (sa) { sa.textContent = a; sa.classList.add(atkWins ? "win" : "lose"); }
    if (sd) { sd.textContent = d; sd.classList.add(atkWins ? "lose" : "win"); }
    if (ver) ver.innerHTML = `${a} - ${d} · ${atkWins ? "ATACANTE GANHA ✅" : (a === d ? "EMPATE: DEFENSOR GANHA 🛡️" : "DEFENSOR GANHA 🛡️")}`;
    if (rr) rr.innerHTML = b.conq ? `🏳️ <b style="color:var(--txt)">${nm(b.by)}</b> conquistou <b style="color:var(--txt)">${esc(TI[b.to].n)}</b>!`
      : `💀 <b style="color:var(--txt)">${atkWins ? nm(b.def) : nm(b.by)}</b> perde 1 soldado em ${esc(TI[atkWins ? b.to : b.from].n)}`;
    floatText(atkWins ? b.to : b.from, "−1 💀", "#dc2626");

    clearTimeout(unfocusT); unfocusT = setTimeout(unfocus, 2600);
    await new Promise(res => setTimeout(res, 900));
  });
}

  const ps = Object.entries(R.players).sort((a, b) => a[1].joined - b[1].joined);
  $("lCount").textContent = ps.length;
  $("lPlayers").innerHTML = ps.map(([u, p]) => `<div class="pitem"><i class="dot" style="background:${COLORS[p.color].f}"></i><div>${esc(p.name)}${u === R.meta.host ? " 👑" : ""}${u === uid ? ' <span class="lbl">(você)</span>' : ""}</div><i class="on-dot ${p.online ? "" : "off"}"></i></div>`).join("");
  const host = R.meta.host === uid; const duo = R.meta.mode === "duo";
  document.querySelectorAll("#lMode button").forEach(b => { const on = (b.dataset.m === "duo") === duo; b.classList.toggle("pri", on); b.disabled = !host && !on; b.onclick = () => host && update(ref(db, `rooms/${roomCode}/meta`), {mode: b.dataset.m}); });
  $("bStart").style.display = host ? "" : "none";
  $("bStart").disabled = duo ? ps.length !== 4 : ps.length < 2;
  $("lWait").textContent = duo
    ? (ps.length !== 4 ? `Dupla x Dupla precisa de 4 jogadores (faltam ${4 - ps.length}). As duplas são sorteadas no início.` : (host ? "4 jogadores! As duplas serão sorteadas ao começar." : "Aguardando o criador da sala começar…"))
    : (host ? (ps.length < 2 ? "Mande o código para seus amigos. Precisa de pelo menos 2 jogadores." : "Todos prontos? Comece quando quiser.") : "Aguardando o criador da sala começar a partida…");
}
function renderGame() {
  const g = R.game; if (!g) return;
  const me = uid, mine = cur(g) === me && !g.winner;
  // aviso de vez
  if (g.orderAnn && g.orderAnn.ts !== lastOrderTs) { if (!firstSnap) showOrderAnn(g); lastOrderTs = g.orderAnn.ts; }
  const turnKey = g.started === false ? "wait" : g.round + ":" + g.turnIdx;
  if (mine && g.started !== false && turnKey !== lastTurnKey && g.phase === "deploy" && g.reinf > 0) showTurnScreen(g);
  lastTurnKey = turnKey;
  // início: objetivo + dado da ordem
  const myRoll = (g.ready || {})[uid];
  if (myRoll && !myRollShown && g.started === false) { myRollShown = true; throwDie(myRoll.v, "a", innerWidth / 2 - 27, innerHeight * .28, true).then(w => setTimeout(() => w.remove(), 1500)); }
  if (g.started === false && !g.winner) openReady();
  else if (modalKind === "ready") closeModal();
  // continente dominado
  if (g.ann && g.ann.ts !== lastAnnTs) { if (!firstSnap) { const A = g.ann; setTimeout(() => showContAnn(A, g), 3200); } lastAnnTs = g.ann.ts; }
  // batalha
  if (g.duel && g.duel.ts !== lastDuelTs) { showDuelPending(g.duel, g, !firstSnap); lastDuelTs = g.duel.ts; }
  if (g.battle && g.battle.ts !== lastBattleTs) {
    if (!firstSnap) { showBattle(g.battle, g); if (g.battle.by === uid) { rollLock = Date.now() + 3000; setTimeout(() => modalKind === "atk" && renderAttack(), 3050); } }
    lastBattleTs = g.battle.ts;
  }
  if (g.duel && g.duel.def === uid && modalKind !== "def") openDefend();
  if (modalKind === "def" && !(g.duel && g.duel.def === uid)) closeModal();
  firstSnap = false;
  if (!mine || g.phase === "deploy") sel = null;
  if (sel && g.owner[sel] !== me) sel = null;
  // topo
  $("gTitle").innerHTML = `Sala ${roomCode} <small>· Rodada ${g.round}</small>`;
  $("gChips").innerHTML = g.order.map(u => {
    const n = owned(g, u).length, tr = owned(g, u).reduce((s, t) => s + g.troops[t], 0);
    const on = R.players[u] && R.players[u].online;
    const pas = g.passive[u] || 0;
    return `<div class="chip ${u === cur(g) && !g.winner ? "cur" : ""} ${g.elim[u] ? "dead" : ""}"><i class="dot" style="background:${COLORS[g.col[u]].f}"></i>${isDuo(g) ? `<b>${g.team[u] === 0 ? "A" : "B"}</b> ` : ""}${esc(g.names[u])}${u === me ? " (você)" : (isAlly(g, me, u) ? " 🤝" : "")} · ${n}🏴 ${tr}⚔ ${(g.cards[u] || []).length}🃏${pas >= 5 ? ` ⚠️${pas}` : ""}${on ? "" : " 📴"}</div>`;
  }).join("");
  $("nCards").textContent = (g.cards[me] || []).length;
  $("bChat").style.display = isDuo(g) && g.team[me] !== undefined ? "" : "none";
  // banner
  const cn = esc(g.names[cur(g)]); let txt = "", warn = "";
  const waitList = g.started === false ? g.order.filter(u => !(g.ready || {})[u]).map(u => esc(g.names[u])) : [];
  if (g.started === false && !g.winner) txt = `🎲 Jogando o dado para definir a ordem. Falta: <b>${waitList.join(", ")}</b>`;
  else if (g.winner) txt = isDuo(g) ? `🏆 <b>${teamName(g, g.winner)}</b> (${mates(g, g.winner).map(x => esc(g.names[x])).join(" e ")}) venceu! Objetivo: ${esc(objText(g, g.winner))}` : `🏆 <b>${esc(g.names[g.winner])}</b> venceu! Objetivo: ${esc(objText(g, g.winner))}`;
  else if (g.elim[me]) txt = `Você foi eliminado. Assistindo… Vez de <b>${cn}</b>.`;
  else if (!mine) txt = `Vez de <b>${cn}</b> · ${{deploy:"distribuindo tropas", attack:"atacando", move:"remanejando"}[g.phase]}`;
  else if (g.phase === "deploy") txt = (g.cards[me].length >= 5) ? "Você tem 5 cartas: <b>troque 3</b> antes de distribuir (🃏)." : (g.reinf > 0 ? `Sua vez! Distribua <b>${g.reinf}</b> tropa(s): toque nos seus territórios.${g.round === 1 ? " (1ª rodada: sem ataques)" : ""}` : (g.round === 1 ? "Tropas distribuídas. Toque em <b>Remanejar</b> (1ª rodada não tem ataque)." : "Tropas distribuídas. Toque em <b>Atacar</b>."));
  else if (g.phase === "attack") txt = sel ? `Atacando de <b>${esc(TI[sel].n)}</b>: toque num vizinho inimigo.` : "<b>Ataque:</b> toque num território seu com 2+ tropas.";
  else txt = sel ? `Movendo de <b>${esc(TI[sel].n)}</b>: toque num vizinho seu.` : "<b>Remanejamento:</b> toque num território seu para mover tropas. Quando terminar, toque em <b>Próximo turno</b>.";
  const pas = g.passive[me] || 0;
  if (!g.winner && !g.elim[me] && pas >= 5) warn = pas >= PASSIVE_LIMIT ? `⚠️ ${pas} rodadas sem atacar: você está recebendo 1 tropa a menos por rodada. Ataque para zerar!` : `⚠️ ${pas} rodadas sem atacar. Com ${PASSIVE_LIMIT}, você passa a receber 1 tropa a menos.`;
  $("gBanner").innerHTML = txt; $("gWarn").textContent = warn;
  const nb = $("bNext");
  if (g.winner) { nb.style.display = ""; nb.textContent = "Nova partida"; nb.disabled = false; }
  else if (g.started === false) nb.style.display = "none";
  else if (mine) { nb.style.display = ""; nb.textContent = {deploy: g.round === 1 ? "Remanejar ➜" : "Atacar ➜", attack:"Remanejar ➜", move:"Próximo turno ➜"}[g.phase]; nb.disabled = g.phase === "deploy" && (g.reinf > 0 || g.cards[me].length >= 5); }
  else nb.style.display = "none";
  // modais dependentes do estado
  if (modalKind === "atk") renderAttack();
  if (mine && g.conq && g.phase === "attack" && modalKind !== "conq") openConq(g.conq);
  if (modalKind === "conq" && !g.conq) closeModal();
  if (modalKind === "cards") openCards();
  if (mine && g.started !== false && g.phase === "deploy" && g.cards[me].length >= 5 && !modalKind) openCards();
  paint();
}
setInterval(() => {
  const g = R && R.game; if (!g || !R.meta || R.meta.status !== "playing") return;
  if (g.winner) { $("gTimer").textContent = "fim"; $("gTimer").classList.remove("low"); return; }
  if (g.started === false) { const w = Math.max(0, Math.ceil((g.readyBy - now()) / 1000)); $("gTimer").textContent = "⏳ " + w + "s"; $("gTimer").classList.remove("low"); checkTimeout(); return; }
  const ms = Math.max(0, g.deadline - (g.duel ? Math.min(now(), g.duel.ts + DEF_MS) : now())); const s = Math.ceil(ms / 1000);
  if (g.duel) { const left = Math.max(0, Math.ceil((g.duel.ts + DEF_MS - now()) / 1000)); const c1 = $("defCount"), c2 = $("defCount2"); if (c1) c1.textContent = `(automático em ${left}s)`; if (c2) c2.textContent = left + "s"; }
  $("gTimer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("gTimer").classList.toggle("low", s <= 20);
  checkTimeout();
}, 250);

/* ================= BOTÕES ================= */
$("bCreate").onclick = () => uid ? createRoom() : toast("Ainda conectando…");
$("bJoin").onclick = () => uid ? joinRoom($("codeIn").value) : toast("Ainda conectando…");
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") $("bJoin").click(); });
$("bShare").onclick = share;
$("bStart").onclick = startGame;
$("bLeaveLobby").onclick = leaveRoom;
$("bMenu").onclick = openMenu;
$("bCards").onclick = () => R && R.game && openCards();
$("bObj").onclick = () => R && R.game && openObj();
$("bConts").onclick = () => R && R.game && openConts();
$("bLog").onclick = () => R && R.game && openLog();
$("bChat").onclick = () => R && R.game && isDuo(R.game) && openChat();
$("bNext").onclick = async () => {
  const g = R.game;
  if (g.winner) {
    if (R.meta.host === uid) { await update(ref(db, `rooms/${roomCode}`), {"meta/status":"lobby", game:null, chat:null}); }
    else toast("O criador da sala pode iniciar uma nova partida.");
    return;
  }
  sel = null; await aNext();
};
svg.on("click", () => { if (sel) { sel = null; paint(); renderGame(); } });

/* ================= INÍCIO ================= */
document.body.appendChild($("battle")); // a tela do duelo fica acima de tudo, inclusive da janela de ataque
$("name").value = localStorage.getItem("cm_name") || "";
const urlCode = new URLSearchParams(location.search).get("sala");
if (urlCode) $("codeIn").value = urlCode.toUpperCase();
buildMap();
onAuthStateChanged(auth, async user => {
  if (!user) { signInAnonymously(auth).catch(e => $("authMsg").textContent = "Erro ao conectar: " + e.message + " (o login Anônimo está ativado no Firebase?)"); return; }
  uid = user.uid; $("authMsg").textContent = "Conectado ✔";
  const saved = localStorage.getItem("cm_room");
  const target = (urlCode || saved || "").toUpperCase();
  if (target) {
    try {
      const s = await get(ref(db, `rooms/${target}/players/${uid}`));
      if (s.exists()) { enterRoom(target); return; }
      if (saved === target) localStorage.removeItem("cm_room");
    } catch (e) { $("authMsg").textContent = "Erro ao acessar o banco: " + e.message; }
  }
});
</script>
</body>
